meta:
  story_id: xunsheng_0623
  chapter_id: signed_for
  sequence: 2
  locale: zh-CN
  title: 签收
  summary: 南厝清册重新出现。问题不再是谁寄出了旧物，而是谁有权替别人认领一段过去。
  content_version: 1.1.0
  license: CC-BY-SA-4.0

accounts:
  - feifeiyu_fishy
  - jinwan_chishenme
  - stpoman
  - nco13_bulletin
  - universal_official
  - caramel_less_ice
  - windbell_7
  - early_tomorrow
  - old_keyboard
  - mori
  - skip_the_queue

clues:
  - id: clue_restore_log
    name: 恢复日志
    description: 清册在例行维护中被当作未完成快递任务恢复，没有人主动发起寄送。
  - id: clue_relation_match
    name: 关系匹配规则
    description: 系统同时使用现住址、亲属关系与旧寄存格，误把“可能相关”当成“有权签收”。
  - id: clue_custody_deadline
    name: 处置期限
    description: NCO13 要求在次日中午前召回包裹并删除清册副本。

cards:
  - id: preserve_ledger
    name: 保全清册
    type: protection
    cost: 2
    rules_text: 获得8点护盾；本回合线索不会被封锁。
  - id: request_consent
    name: 征求本人
    type: protocol
    cost: 2
    rules_text: 每当打出证据，获得2点护盾；持续3回合。
  - id: separate_match
    name: 区分关联与所有
    type: argument
    cost: 1
    rules_text: 使敌方暴露；若持有“关系匹配规则”，抽1张牌。

encounters:
  - id: encounter_recall_notice
    name: 统一召回
    player_credibility: 30
    enemy_integrity: 28
    enemy_pattern:
      - turn: 1
        intent: 标记全部包裹为数据错误
        damage: 6
      - turn: 2
        intent: 封锁旧清册来源
        damage: 5
        applies: noise
      - turn: 3
        intent: 要求立即删除副本
        damage: 8
      - turn: 4
        intent: 重复处置通知
        damage: 7
    reward_choices:
      - preserve_ledger
      - separate_match
    victory_effects:
      - type: set_flag
        key: recall_challenged
        value: true
    defeat_effects:
      - type: set_flag
        key: recall_pressure
        value: true
  - id: encounter_claim_channel
    name: 认领渠道公开审查
    player_credibility: 30
    enemy_integrity: 46
    enemy_pattern:
      - turn: 1
        intent: 质疑清册真实性
        damage: 6
      - turn: 2
        intent: 放大住址泄露风险
        damage: 8
        applies: noise
      - turn: 3
        intent: 混淆亲属与所有权
        damage: 8
      - turn: 4
        intent: 锁定公开帖
        damage: 10
        applies: noise
      - turn: 5
        intent: 执行统一销毁
        damage: 12
    reward_choices: []
    victory_effects:
      - type: set_flag
        key: voluntary_claim_approved
        value: true
    defeat_effects:
      - type: set_flag
        key: ledger_destroyed
        value: true

scenes:
  - id: scene_ledger_returns
    entry_conditions:
      - type: has_clue
        clue_id: clue_hidden_number
    on_enter:
      - type: reveal_thread
        thread_id: thread_stpoman_ledger
    threads:
      - id: thread_stpoman_ledger
        board_id: xunsheng_0623
        author_id: stpoman
        title: 南厝不是寄件站，它最后几年只保管没人带走的东西
        body: |-
          南厝被拆以前，搬迁住户会把暂时带不走的物品寄存在驿站。到期没人来领的，不是垃圾，也没有自动转给亲属；清册上只写寄存格、物品描述和当时留下的联系方式。

          昨天维护系统恢复了一批“未完成任务”。旧清册被误认成待派送列表，新系统又用现住址和互认关系补全了收件人。没有神秘寄件人，也没有谁按下批量寄送。是两套都以为自己在善后的系统，把“可能相关”拼成了“可以签收”。

          我保留了一份只含格号和物品描述的副本。完整姓名不发。
        timestamp: 6月24日 09:12
        status: pinned
        comments:
          - id: comment_dinner_recorder
            author_id: jinwan_chishenme
            body: 录音笔下面的042和清册一致。原寄存人只留了一句：“给知道这道汤该放多少盐的人。”我不知道。
            timestamp: 6月24日 09:18
            replies: []
            state: normal
          - id: comment_old_keyboard_rights
            author_id: old_keyboard
            body: 相关不等于所有。就算匹配到了亲属，也不能默认对方愿意知道。
            timestamp: 6月24日 09:25
            replies: []
            state: normal
          - id: comment_skip_destroy
            author_id: skip_the_queue
            body: 那就全部退回销毁，别把几十年前的麻烦递给现在的人。
            timestamp: 6月24日 09:29
            replies: []
            state: normal
    interaction_stage:
      id: stage_interpret_ledger
      interaction_limit: 1
      show_budget: true
      can_end_early: true
      choice_set_ids: [choices_interpret_ledger]
      on_end:
        - type: set_flag
          key: ledger_position_set
          value: true
      on_end_if_empty:
        - type: set_route
          route: disposal
    choice_sets:
      - id: choices_interpret_ledger
        prompt: 你如何定义这批匹配结果？
        choices:
          - id: choice_distinguish_ownership
            action_type: create_reply
            target_id: comment_old_keyboard_rights
            title: null
            body: 地址、血缘和所有权是三件事。先保全不含姓名的物品清单，再让知情者自行决定是否申请核验。
            tone: cautious
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_restore_log
              - type: grant_clue
                clue_id: clue_relation_match
              - type: grant_card
                card_id: separate_match
              - type: increment_counter
                key: consent_points
                amount: 1
              - type: set_flag
                key: ledger_position_set
                value: true
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_keep_public_copy
            action_type: create_comment
            target_id: thread_stpoman_ledger
            title: null
            body: 至少留下格号、物品描述和恢复日志。只有可核对的公开副本，才能防止清册被悄悄改写。
            tone: publish
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_restore_log
              - type: grant_clue
                clue_id: clue_relation_match
              - type: grant_card
                card_id: preserve_ledger
              - type: increment_counter
                key: evidence_points
                amount: 1
              - type: set_flag
                key: ledger_position_set
                value: true
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_support_disposal
            action_type: create_reply
            target_id: comment_skip_destroy
            title: null
            body: 错误匹配已经伤害了现住户。召回包裹并删除关系数据，是风险最低的处理。
            tone: withdraw
            conditions: []
            effects:
              - type: set_route
                route: disposal
              - type: set_flag
                key: ledger_position_set
                value: true
            once: true
            narrative_scope: main
            interaction_cost: 1
    exits:
      - to: scene_recall
        conditions:
          - type: flag_equals
            key: ledger_position_set
            value: true

  - id: scene_recall
    entry_conditions:
      - type: flag_equals
        key: ledger_position_set
        value: true
    on_enter:
      - type: reveal_thread
        thread_id: thread_nco_recall
    threads:
      - id: thread_nco_recall
        board_id: xunsheng_0623
        author_id: nco13_bulletin
        title: 关于6月23日历史寄存数据错投的处置通知
        body: |-
          经核查，相关包裹由失效数据恢复引发，不构成合法寄送。请收件人于次日12:00前预约无接触召回，不要继续拆阅、复制或传播箱内资料。

          管理署将删除错误恢复的关系数据与派送任务。涉及历史物品的后续处置以安全、隐私和现行登记为准。
        timestamp: 6月24日 11:40
        status: pinned
        comments:
          - id: comment_fishy_recall
            author_id: feifeiyu_fishy
            body: 小报要求说明：不含身份的物品清单为什么也必须删除？是否存在当事人自愿核验的渠道？
            timestamp: 6月24日 11:48
            replies: []
            state: normal
          - id: comment_early_deadline
            author_id: early_tomorrow
            body: 从公告到截止不到一天，很多收到包裹的人甚至还没上线。
            timestamp: 6月24日 12:01
            replies: []
            state: normal
    interaction_stage:
      id: stage_answer_recall
      interaction_limit: 1
      show_budget: true
      can_end_early: true
      choice_set_ids: [choices_answer_recall]
      on_end: []
      on_end_if_empty:
        - type: set_flag
          key: ledger_destroyed
          value: true
    choice_sets:
      - id: choices_answer_recall
        prompt: 召回通知正在压缩调查时间。
        choices:
          - id: choice_challenge_recall
            action_type: create_reply
            target_id: comment_fishy_recall
            title: null
            body: 先要求延长期限，并把“身份关系数据”和“匿名物品清单”分开处置。全部删除不是唯一的隐私保护方式。
            tone: challenge
            conditions:
              - type: not
                condition:
                  type: route_equals
                  route: disposal
            effects:
              - type: grant_clue
                clue_id: clue_custody_deadline
              - type: start_encounter
                encounter_id: encounter_recall_notice
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_accept_recall
            action_type: create_comment
            target_id: thread_nco_recall
            title: null
            body: 我支持统一召回。错误恢复的数据不应继续流通，请同时公布删除完成记录。
            tone: support
            conditions:
              - type: route_equals
                route: disposal
            effects:
              - type: set_flag
                key: ledger_destroyed
                value: true
            once: true
            narrative_scope: main
            interaction_cost: 1
    exits:
      - to: scene_final_proposal
        conditions:
          - type: flag_equals
            key: recall_challenged
            value: true
      - to: scene_unclaimed
        conditions:
          - type: flag_equals
            key: ledger_destroyed
            value: true
      - to: scene_recall
        conditions:
          - type: flag_equals
            key: recall_pressure
            value: true

  - id: scene_final_proposal
    entry_conditions:
      - type: flag_equals
        key: recall_challenged
        value: true
    on_enter:
      - type: reveal_thread
        thread_id: thread_claim_proposal
    threads:
      - id: thread_claim_proposal
        board_id: xunsheng_0623
        author_id: feifeiyu_fishy
        title: 提案：不公开姓名的南厝物品认领页
        body: |-
          提案只公开格号和物品描述。申请人主动提交自己掌握的细节，由相互隔离的审核人员核验；匹配失败不保留身份资料，匹配成功也由原寄存人或合法继承人决定是否建立联系。

          这不是恢复南厝，也不是把包裹留给现住户。它只是拒绝让“全部公开”和“全部销毁”成为仅有的两个选项。
        timestamp: 6月24日 16:20
        status: normal
        comments:
          - id: comment_stpoman_support
            author_id: stpoman
            body: 我愿意把匿名副本交给第三方核验。原清册不离开保管环境。
            timestamp: 6月24日 16:27
            replies: []
            state: normal
          - id: comment_dinner_choice
            author_id: jinwan_chishenme
            body: 我会把042送去核验，但不要求知道那位姓许的人是谁。至少让会做那道汤的人自己决定。
            timestamp: 6月24日 16:31
            replies: []
            state: normal
    interaction_stage:
      id: stage_publish_claim_channel
      interaction_limit: 1
      show_budget: true
      can_end_early: true
      choice_set_ids: [choices_publish_claim_channel]
      on_end: []
      on_end_if_empty:
        - type: set_flag
          key: ledger_destroyed
          value: true
    choice_sets:
      - id: choices_publish_claim_channel
        prompt: 这是本期最后一次发布，将决定结局。
        choices:
          - id: choice_publish_voluntary_channel
            action_type: create_post
            target_id: xunsheng_0623
            title: 我支持自愿认领，不支持公开关系名单
            body: 保留匿名清单、隔离身份核验、由相关人主动申请，并让任何人都能撤回。旧物不该替人决定过去，但我们可以把决定权交还给本人。
            tone: publish
            conditions:
              - type: has_clue
                clue_id: clue_restore_log
              - type: has_clue
                clue_id: clue_relation_match
              - type: has_clue
                clue_id: clue_custody_deadline
            effects:
              - type: grant_card
                card_id: request_consent
              - type: start_encounter
                encounter_id: encounter_claim_channel
            once: true
            narrative_scope: main
            interaction_cost: 1
    exits:
      - to: scene_returned
        conditions:
          - type: flag_equals
            key: voluntary_claim_approved
            value: true
      - to: scene_unclaimed
        conditions:
          - type: flag_equals
            key: ledger_destroyed
            value: true

  - id: scene_returned
    entry_conditions:
      - type: flag_equals
        key: voluntary_claim_approved
        value: true
    on_enter: []
    threads:
      - id: thread_returned_epilogue
        board_id: xunsheng_0623
        author_id: jinwan_chishenme
        title: 042有人认出来了
        body: |-
          对方只回答了菜谱最后一页的问题，没有索要我的地址。录音笔和菜谱已经通过核验点交回，车票留给了我——原寄存记录说，谁替它们找到路，谁就可以留一张。

          汤要放多少盐？对方说：“端上桌以后再问。”我还是没懂，但这次不用我懂。
        timestamp: 6月27日 19:06
        status: normal
        comments: []
    choice_sets: []
    exits:
      - to: ending:returned_to_owner
        conditions: []
    on_exit:
      - type: complete_story
        story_id: xunsheng_0623
        ending_id: returned_to_owner

  - id: scene_unclaimed
    entry_conditions:
      - type: flag_equals
        key: ledger_destroyed
        value: true
    on_enter: []
    threads:
      - id: thread_unclaimed_epilogue
        board_id: xunsheng_0623
        author_id: nco13_bulletin
        title: 历史寄存数据处置完成
        body: |-
          相关派送任务、关系匹配结果及残余清册副本已完成删除。未领取物品依规转入统一处置流程。本帖不再接受回复。
        timestamp: 6月25日 12:04
        status: locked
        comments:
          - id: comment_deleted_fishy
            author_id: feifeiyu_fishy
            body: 此回复已删除。
            timestamp: 6月25日 12:05
            replies: []
            state: deleted
    choice_sets: []
    exits:
      - to: ending:unclaimed
        conditions: []
    on_exit:
      - type: complete_story
        story_id: xunsheng_0623
        ending_id: unclaimed
