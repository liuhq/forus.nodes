meta:
  story_id: online_harassment_case
  day_id: day_02
  sequence: 2
  locale: zh-CN
  display_date: 11月6日
  title: 删除不等于澄清
  summary: 删除原帖没有结束争议，公开版本记录开始显出截图缺失的时间线。
  on_end: []
accounts:
  - id: target_student_17
    username: "@晚自习后"
    role: target
  - id: source_keeper
    username: "@原稿保存者"
    role: community
  - id: contest_observer
    username: "@比赛观察员"
    role: community
clues:
  - id: draft_gap
    name: 草稿缺口
    description: 流传对比图缺少中间版本和授权说明。
evidence:
  - id: draft_version
    name: 草稿版本记录
    description: 比赛作品的公开版本、时间和署名记录。
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_deleted_post
    sequence: 1
    title: 删除记录
    threads:
      - id: thread_deleted_post
        board_id: contest_watch
        author_id: contest_observer
        title: 她删帖就是心虚吗
        body: 删除时间被转发者解释为“默认承认”。原帖缓存仍在继续传播。
        timestamp: 11月6日 08:40
        status: normal
        comments: []
    choice_sets:
      - id: choices_deleted_post
        choices:
          - id: choice_compare_delete_time
            action_type: create_comment
            target_id: thread_deleted_post
            title: null
            body: 删除只能说明她停止了原帖传播，不能单独证明她承认所有指控。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_agree_delete_guilt
            action_type: react_agree
            target_id: thread_deleted_post
            title: 赞同“删除就是认错”
            body: null
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_draft_records
    sequence: 2
    title: 版本记录
    threads:
      - id: thread_draft_records
        board_id: contest_watch
        author_id: source_keeper
        title: 完整草稿还缺一页
        body: 公开草稿显示两人曾交换过设计意见，但授权记录还没有整理完。
        timestamp: 11月6日 12:20
        status: pinned
        comments: []
    choice_sets:
      - id: choices_draft_records
        choices:
          - id: choice_request_public_versions
            action_type: create_reply
            target_id: thread_draft_records
            title: null
            body: 先整理公开版本和时间线，不要把任何私信作为公开证据。
            conditions: []
            effects:
              - type: grant_clue
                clue_id: draft_gap
              - type: grant_evidence
                evidence_id: draft_version
                initial_confidence: 1
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_amplify_accusation
            action_type: create_reply
            target_id: thread_draft_records
            title: null
            body: 既然她删过帖，就应该先公开道歉再谈版本。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages:
      - id: dm_target_admission
        sender_id: target_student_17
        participant_ids: [player, target_student_17]
        visibility: private
        trigger_conditions:
          - type: private_flag_equals
            flag: private_boundary_respected
            value: true
        arrival: next_phase
        messages:
          - id: dm_target_admission_message
            author_id: target_student_17
            body: 我确实以为她偷了作品。我没有查清楚就发了帖子，后来私下道歉了，但不敢公开说。
            timestamp: 11月6日 19:10
            state: unread
        choice_sets:
          - id: choices_target_admission
            choices:
              - id: choice_accept_accountability
                action_type: reply_direct_message
                target_id: dm_target_admission_message
                title: 接受责任边界
                body: 你需要为错误指控道歉，但这不代表别人可以继续公开你的个人信息。
                conditions: []
                effects:
                  - type: set_private_flag
                    flag: target_accountability_acknowledged
                    value: true
                  - type: increment_hidden_value
                    value: target_safety
                    amount: 1
              - id: choice_pressure_public_apology
                action_type: reply_direct_message
                target_id: dm_target_admission_message
                title: 要求立即公开道歉
                body: 你应该现在就把所有私下内容公开，大家才会相信你。
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: target_safety
                    amount: -1
    on_enter: []
    on_end: []
summary:
  title: 删除不等于澄清
  body: 玩家确认目标人物确实犯过错误，但完整版本仍需要公开材料核验。
