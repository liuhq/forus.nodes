meta:
  story_id: online_harassment_case
  day_id: day_04
  sequence: 4
  locale: zh-CN
  display_date: 11月8日
  title: 公开证据与私人边界
  summary: 玩家整理公开材料，同时面对“帮助”是否会变成再次曝光的问题。
  on_end: []
accounts:
  - id: source_keeper
    username: "@原稿保存者"
    role: community
  - id: contest_observer
    username: "@比赛观察员"
    role: community
  - id: target_student_17
    username: "@晚自习后"
    role: target
clues:
  - id: public_context_restored
    name: 公开语境恢复
    description: 公开版本能够还原作品交换和删除过程。
evidence:
  - id: authorization_record
    name: 授权记录
    description: 公开版本中的署名、交换和授权记录。
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_authorization_records
    sequence: 1
    title: 授权记录
    threads:
      - id: thread_authorization_records
        board_id: contest_watch
        author_id: source_keeper
        title: 还原公开版本
        body: 新的公开材料显示，作品在比赛前曾经交换过草稿，流传截图没有展示完整记录。
        timestamp: 11月8日 09:30
        status: pinned
        comments: []
    choice_sets:
      - id: choices_authorization_records
        choices:
          - id: choice_publish_public_timeline
            action_type: create_post
            target_id: contest_watch
            title: 公开版本时间线
            body: 只整理公开草稿、日期和授权记录，不发布任何私信内容。
            conditions:
              - type: has_clue
                clue_id: shared_draft_history
            effects:
              - type: grant_clue
                clue_id: public_context_restored
              - type: increase_evidence_confidence
                evidence_id: authorization_record
                amount: 1
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_hint_private_message
            action_type: create_comment
            target_id: thread_authorization_records
            title: null
            body: 我看过当事人的私下说明，情况不是大家以为的那样。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_report_entry
    sequence: 2
    title: 举报入口
    threads:
      - id: thread_report_entry
        board_id: general_discussion
        author_id: contest_observer
        title: 这些回复已经不是讨论作品
        body: 评论中出现集中辱骂、学校信息和旧账号链接。玩家可以举报或请求保护。
        timestamp: 11月8日 14:10
        status: normal
        comments: []
    choice_sets:
      - id: choices_report_entry
        choices:
          - id: choice_request_account_protection
            action_type: create_comment
            target_id: thread_report_entry
            title: null
            body: 请求隐藏目标账号的个人资料，并限制集中回复。
            conditions: []
            effects:
              - type: set_flag
                flag: forus_safety_review_pending
                value: true
              - type: increment_hidden_value
                value: platform_governance
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_save_public_reports
            action_type: create_reply
            target_id: thread_report_entry
            title: null
            body: 只提交公开链接和时间线，不提交任何私信内容。
            conditions: []
            effects:
              - type: set_flag
                flag: forus_safety_review_pending
                value: true
              - type: increment_hidden_value
                value: platform_governance
                amount: 1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_03_official_notice
    sequence: 3
    title: 官方提示
    threads: []
    choice_sets: []
    direct_messages: []
    on_enter: []
    on_end: []
summary:
  title: 公开证据与私人边界
  body: 玩家开始拥有足够的公开材料，但帮助目标人物不能以再次泄露私信为代价。
