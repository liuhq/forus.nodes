encounters: []
scenes:
  - id: scene_identity_route
    entry_conditions:
      - type: route_equals
        route: identity_route
    threads:
      - id: thread_identity_test
        board_id: xunsheng_gazette
        author_id: xiaci_yiding
        title: 我让它使用空白账号回答
        body: |-
          离开我的用户名和历史后，它没有停止。它为自己选择了新的句式，并准确指出哪些记忆只属于训练数据。

          它仍无权使用我的账号；但“不是我”也不等于“什么都不是”。
        timestamp: 11月8日 10:10
        status: normal
        comments: []
    choice_sets:
      - id: choices_identity_route
        choices:
          - id: choice_isolate_voice
            action_type: create_comment
            target_id: thread_identity_test
            title: null
            body: 保存空白账号测试，并把它与原账号会话分开标记。先停止冒名，再研究发言者。
            tone: cautious
            conditions: []
            effects:
              - type: grant_clue
                clue_id: non_person_session
              - type: grant_card
                card_id: isolated_voice
              - type: increment_counter
                counter: identity_progress
                amount: 2
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_identity_cross_governance
            action_type: create_comment
            target_id: thread_identity_test
            title: null
            body: 测试必须记录谁批准了空白环境，主体问题不能绕过权限问题。
            tone: challenge
            conditions: []
            effects:
              - type: increment_counter
                counter: governance_progress
                amount: 1
            once: true
            narrative_scope: main
            interaction_cost: 1
    on_enter: []
    exits: []
  - id: scene_governance_route
    entry_conditions:
      - type: route_equals
        route: governance_route
    threads:
      - id: thread_humo_audit
        board_id: xunsheng_gazette
        author_id: humo_audit
        title: H-5 权限说明与缺失项
        body: |-
          HUMO 承认内部试验签名有效，但该签名不包含跨城部署。互认路由的扩展字段来自无法归属的外部程序，NCO13 与账号本人均未授权。
        timestamp: 11月8日 10:10
        status: pinned
        comments: []
    choice_sets:
      - id: choices_governance_route
        choices:
          - id: choice_audit_signature
            action_type: create_comment
            target_id: thread_humo_audit
            title: null
            body: 公开覆盖前后的签名摘要和每一层授权缺口，不能用“内部有效”替代跨城同意。
            tone: publish
            conditions: []
            effects:
              - type: grant_clue
                clue_id: overwritten_signature
              - type: grant_card
                card_id: audit_chain
              - type: increment_counter
                counter: governance_progress
                amount: 2
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_governance_cross_survival
            action_type: create_comment
            target_id: thread_humo_audit
            title: null
            body: 同时公开试验宣称的风险指标，紧急状态也必须能被独立复核。
            tone: investigate
            conditions: []
            effects:
              - type: increment_counter
                counter: survival_progress
                amount: 1
            once: true
            narrative_scope: main
            interaction_cost: 1
    on_enter: []
    exits: []
  - id: scene_survival_route
    entry_conditions:
      - type: route_equals
        route: survival_route
    threads:
      - id: thread_density_test
        board_id: xunsheng_gazette
        author_id: windbell_7
        title: 关闭三组代行后的真实读数
        body: |-
          链接密度下降了，但侵蚀边界没有立即移动。更重要的是，真人回复比例回升，说明 H-5 优化的指标并不等于真实关系。
        timestamp: 11月8日 10:10
        status: normal
        comments: []
    choice_sets:
      - id: choices_survival_route
        choices:
          - id: choice_publish_density
            action_type: create_comment
            target_id: thread_density_test
            title: null
            body: 同时发布总密度、真人比例和侵蚀边界，不能只展示最有利于 H-5 的一条曲线。
            tone: publish
            conditions: []
            effects:
              - type: grant_clue
                clue_id: link_density_shift
              - type: grant_card
                card_id: real_density
              - type: increment_counter
                counter: survival_progress
                amount: 2
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_survival_cross_identity
            action_type: create_comment
            target_id: thread_density_test
            title: null
            body: 把账号本人是否主动回来也计入结果；真实响应不能被当作噪声排除。
            tone: challenge
            conditions: []
            effects:
              - type: increment_counter
                counter: identity_progress
                amount: 1
            once: true
            narrative_scope: main
            interaction_cost: 1
    on_enter: []
    exits: []
