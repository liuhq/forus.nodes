meta:
  story_id: online_harassment_case
  day_id: day_03
  sequence: 3
  locale: zh-CN
  display_date: 11月7日
  title: 完整语境或沉默
  summary: 完整草稿开始出现，目标人物是否信任玩家决定下一步能否取得时间线。
  on_end: []
accounts:
  - id: target_student_17
    username: "@晚自习后"
    role: target
  - id: source_keeper
    username: "@原稿保存者"
    role: community
  - id: contest_observer
    username: "@比赛观察员"
    role: community
clues:
  - id: shared_draft_history
    name: 共同草稿记录
    description: 两名学生曾交换草稿，作品相似并不能单独证明盗用。
evidence:
  - id: authorization_record
    name: 授权记录
    description: 公开版本中的署名、交换和授权记录。
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_two_drafts
    sequence: 1
    title: 两份草稿
    threads:
      - id: thread_two_drafts
        board_id: contest_watch
        author_id: source_keeper
        title: 两份草稿到底差在哪里
        body: 一份版本显示两人曾交换设计意见，另一份被截去了日期和署名。
        timestamp: 11月7日 09:00
        status: pinned
        comments: []
    choice_sets:
      - id: choices_two_drafts
        choices:
          - id: choice_compare_versions
            action_type: create_comment
            target_id: thread_two_drafts
            title: null
            body: 先对照完整版本，再判断这是盗用、共同创作还是版本误读。
            conditions:
              - type: evidence_confidence_at_least
                evidence_id: draft_version
                confidence: 1
            effects:
              - type: grant_clue
                clue_id: shared_draft_history
              - type: grant_evidence
                evidence_id: authorization_record
                initial_confidence: 1
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_repeat_theft_claim
            action_type: react_agree
            target_id: thread_two_drafts
            title: 赞同“就是盗用”
            body: null
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_accountability_boundary
    sequence: 2
    title: 责任边界
    threads:
      - id: thread_accountability_boundary
        board_id: general_discussion
        author_id: contest_observer
        title: 做错了就该接受所有后果吗
        body: 评论区把“需要道歉”和“应该被公开惩罚”混成了同一件事。
        timestamp: 11月7日 13:30
        status: normal
        comments: []
    choice_sets:
      - id: choices_accountability_boundary
        choices:
          - id: choice_set_boundary
            action_type: create_reply
            target_id: thread_accountability_boundary
            title: null
            body: 她需要为错误指控道歉，但这不等于可以公开她的学校和照片。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_accept_all_punishment
            action_type: create_reply
            target_id: thread_accountability_boundary
            title: null
            body: 既然她错过，就应该接受所有后果。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
          - id: choice_verify_first
            action_type: react_disagree
            target_id: thread_accountability_boundary
            title: 反对先定罪
            body: null
            conditions: []
            effects:
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_03_branch_window
    sequence: 3
    title: 分支窗口
    threads: []
    choice_sets: []
    direct_messages:
      - id: dm_target_full_timeline
        sender_id: target_student_17
        participant_ids: [player, target_student_17]
        visibility: private
        trigger_conditions:
          - type: hidden_value_at_least
            value: target_safety
            amount: 2
        arrival: current_phase
        messages:
          - id: dm_target_full_timeline_message
            author_id: target_student_17
            body: 我可以把完整时间线告诉你，但有些内容请不要公开。我确实判断错了，也已经向她道歉。
            timestamp: 11月7日 19:00
            state: unread
        choice_sets:
          - id: choices_target_full_timeline
            choices:
              - id: choice_respect_private_timeline
                action_type: reply_direct_message
                target_id: dm_target_full_timeline_message
                title: 尊重隐私边界
                body: 你可以告诉我哪些材料能公开，哪些只能留在私信里。
                conditions: []
                effects:
                  - type: set_private_flag
                    flag: full_timeline_shared
                    value: true
                  - type: increment_hidden_value
                    value: target_safety
                    amount: 1
              - id: choice_pressure_total_disclosure
                action_type: reply_direct_message
                target_id: dm_target_full_timeline_message
                title: 要求全部公开
                body: 如果你不公开所有内容，别人不会相信你。
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: target_safety
                    amount: -1
    on_enter: []
    on_end: []
summary:
  title: 完整语境或沉默
  body: 第三日结束时，玩家的处理方式决定目标人物是否继续信任玩家。
