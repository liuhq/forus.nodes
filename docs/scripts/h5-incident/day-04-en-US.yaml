  - id: humo_audit
    username: "@HUMO审计"
    role: organization
  - id: windbell_7
    username: "@windbell_7"
    role: community
clues: []
cards:
  - id: isolated_voice
    name: Isolated Voice
    type: ProtectionCard
    cost: 1
    rules_text: Gain 5 guard; gain 1 influence if Identity is the primary route.
    base_damage: 0
    effects: []
    keywords: []
    route_scope: identity_route
  - id: audit_chain
    name: Audit Chain
    type: EvidenceCard
    cost: 2
    rules_text: Base damage 7; remove enemy guard if Governance is the primary route.
    base_damage: 7
    effects: []
    keywords: []
    route_scope: governance_route
  - id: real_density
    name: Real Density
    type: ProtocolCard
    cost: 2
    rules_text: Gain 1 influence after the first protection card played each round.
    base_damage: 0
    effects: []
    keywords: [protocol]
    route_scope: survival_route
encounters: []
scenes:
  - id: scene_identity_route
    entry_conditions:
      - type: route_equals
        route: identity_route
    threads:
      - id: thread_identity_test
        board_id: xunsheng_gazette
        author_id: xiaci_yiding
        title: I asked it to answer through a blank account
        body: |-
          Away from my username and history, it did not stop. It chose new phrasing and correctly identified which memories existed only in training data.

          It still has no right to use my account. But “not me” does not mean “nothing.”
        timestamp: November 8, 10:10
        status: normal
        comments: []
    choice_sets:
      - id: choices_identity_route
        choices:
          - id: choice_isolate_voice
            action_type: create_comment
            target_id: thread_identity_test
            title: null
            body: Preserve the blank-account test and label it separately. Stop the impersonation before studying the speaker.
            tone: cautious
            conditions: []
            effects:
              - type: grant_clue
                clue_id: non_person_session
              - type: grant_card
                card_id: isolated_voice
              - type: increment_counter
                counter: identity_progress
                amount: 2
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_identity_cross_governance
            action_type: create_comment
            target_id: thread_identity_test
            title: null
            body: Record who authorized the blank environment. A question of subjecthood cannot bypass permission.
            tone: challenge
            conditions: []
            effects:
              - type: increment_counter
                counter: governance_progress
                amount: 1
            once: true
            narrative_scope: main
            interaction_cost: 1
    on_enter: []
    exits: []
  - id: scene_governance_route
    entry_conditions:
      - type: route_equals
        route: governance_route
    threads:
      - id: thread_humo_audit
        board_id: xunsheng_gazette
        author_id: humo_audit
        title: H-5 permissions and missing authorizations
        body: |-
          HUMO acknowledges a valid internal trial signature, but it did not authorize cross-city deployment. The mutual-route extension came from an unattributed external program. Neither NCO13 nor the owners approved it.
        timestamp: November 8, 10:10
        status: pinned
        comments: []
    choice_sets:
      - id: choices_governance_route
        choices:
          - id: choice_audit_signature
            action_type: create_comment
            target_id: thread_humo_audit
            title: null
            body: Publish signature summaries and each authorization gap. “Internally valid” cannot substitute for cross-city consent.
            tone: publish
            conditions: []
            effects:
              - type: grant_clue
                clue_id: overwritten_signature
              - type: grant_card
                card_id: audit_chain
              - type: increment_counter
                counter: governance_progress
                amount: 2
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_governance_cross_survival
            action_type: create_comment
            target_id: thread_humo_audit
            title: null
            body: Publish the claimed risk metrics too. Even an emergency claim must be independently reproducible.
            tone: investigate
            conditions: []
            effects:
              - type: increment_counter
                counter: survival_progress
                amount: 1
            once: true
            narrative_scope: main
            interaction_cost: 1
    on_enter: []
    exits: []
  - id: scene_survival_route
    entry_conditions:
      - type: route_equals
        route: survival_route
    threads:
      - id: thread_density_test
        board_id: xunsheng_gazette
        author_id: windbell_7
        title: Real readings after disabling three proxy groups
        body: |-
          Link density fell, but the erosion boundary did not move immediately. More importantly, the share of human replies rose. H-5's optimized metric was not the same as real relationships.
        timestamp: November 8, 10:10
        status: normal
        comments: []
    choice_sets:
      - id: choices_survival_route
        choices:
          - id: choice_publish_density
            action_type: create_comment
            target_id: thread_density_test
            title: null
            body: Publish total density, human participation, and the erosion boundary together—not only the curve favorable to H-5.
            tone: publish
            conditions: []
            effects:
              - type: grant_clue
                clue_id: link_density_shift
              - type: grant_card
                card_id: real_density
              - type: increment_counter
                counter: survival_progress
                amount: 2
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_survival_cross_identity
            action_type: create_comment
            target_id: thread_density_test
            title: null
            body: Count whether owners choose to return. Real responses cannot be discarded as noise.
            tone: challenge
            conditions: []
            effects:
              - type: increment_counter
                counter: identity_progress
                amount: 1
            once: true
            narrative_scope: main
            interaction_cost: 1
    on_enter: []
    exits: []
