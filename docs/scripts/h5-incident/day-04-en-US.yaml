meta:
  story_id: online_harassment_case
  day_id: day_04
  sequence: 4
  locale: en-US
  display_date: November 8
  title: Public Evidence and Private Boundaries
  summary: The player organizes public material while facing the risk that “help” can become another exposure.
  on_end: []
accounts:
  - id: source_keeper
    username: "@DraftKeeper"
    role: community
  - id: contest_observer
    username: "@ContestObserver"
    role: community
  - id: target_student_17
    username: "@AfterStudyHall"
    role: target
clues:
  - id: public_context_restored
    name: Public context restored
    description: Public versions reconstruct the exchange and deletion timeline.
evidence:
  - id: authorization_record
    name: Authorization record
    description: Public credit, exchange, and authorization records from the versions.
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_authorization_records
    sequence: 1
    title: The authorization record
    threads:
      - id: thread_authorization_records
        board_id: contest_watch
        author_id: source_keeper
        title: Reconstructing the public versions
        body: New public material shows that the drafts were exchanged before the contest. The circulating screenshot omits the full record.
        timestamp: November 8 09:30
        status: pinned
        comments: []
    choice_sets:
      - id: choices_authorization_records
        choices:
          - id: choice_publish_public_timeline
            action_type: create_post
            target_id: contest_watch
            title: Publish the public timeline
            body: Organize only public drafts, dates, and authorization records. Do not publish private messages.
            conditions:
              - type: has_clue
                clue_id: shared_draft_history
            effects:
              - type: grant_clue
                clue_id: public_context_restored
              - type: increase_evidence_confidence
                evidence_id: authorization_record
                amount: 1
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_hint_private_message
            action_type: create_comment
            target_id: thread_authorization_records
            title: null
            body: I have seen a private explanation from the target. This is not what people think.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_report_entry
    sequence: 2
    title: The report entry
    threads:
      - id: thread_report_entry
        board_id: general_discussion
        author_id: contest_observer
        title: These replies are no longer about the work
        body: Replies now contain concentrated abuse, the school name, and old account links. The player can report or request protection.
        timestamp: November 8 14:10
        status: normal
        comments: []
    choice_sets:
      - id: choices_report_entry
        choices:
          - id: choice_request_account_protection
            action_type: create_comment
            target_id: thread_report_entry
            title: null
            body: Request that the target’s profile be hidden and concentrated replies be limited.
            conditions: []
            effects:
              - type: set_flag
                flag: forus_safety_review_pending
                value: true
              - type: increment_hidden_value
                value: platform_governance
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_save_public_reports
            action_type: create_reply
            target_id: thread_report_entry
            title: null
            body: Submit only public links and the timeline. Do not submit any private messages.
            conditions: []
            effects:
              - type: set_flag
                flag: forus_safety_review_pending
                value: true
              - type: increment_hidden_value
                value: platform_governance
                amount: 1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_03_official_notice
    sequence: 3
    title: Official notice
    threads: []
    choice_sets: []
    direct_messages: []
    on_enter: []
    on_end: []
summary:
  title: Public Evidence and Private Boundaries
  body: The player has enough public material to continue, but helping the target cannot come at the cost of leaking private messages.
