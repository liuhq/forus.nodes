meta:
  story_id: online_harassment_case
  day_id: day_05
  sequence: 5
  locale: zh-CN
  display_date: 11月9日
  title: 平台是否介入
  summary: 热榜把错误指控改写成“惯犯证据”，玩家决定是否把公开材料交给 Forus 处理。
  on_end: []
accounts:
  - id: trend_reposter
    username: "@热榜搬运站"
    role: media
  - id: contest_observer
    username: "@比赛观察员"
    role: community
  - id: forus_community_admin
    username: "@Forus社区管理员"
    role: official
clues:
  - id: concentrated_harassment
    name: 集中围攻
    description: 多个帖子在相近时间重复相同指控并扩散个人信息。
evidence:
  - id: public_report_receipt
    name: 公开举报回执
    description: Forus 对公开举报、链接和处理时间的记录。
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_trend_repost
    sequence: 1
    title: 热榜搬运
    threads:
      - id: thread_trend_repost
        board_id: general_discussion
        author_id: trend_reposter
        title: 校园创作争议完整汇总
        body: 标题把“错误指控”改写成“惯犯证据”，评论数量迅速增加。
        timestamp: 11月9日 09:20
        status: pinned
        comments: []
    choice_sets:
      - id: choices_trend_repost
        choices:
          - id: choice_report_concentrated_harassment
            action_type: create_reply
            target_id: thread_trend_repost
            title: null
            body: 这不是普通争论。请记录集中辱骂、个人信息扩散和重复转发的公开链接。
            conditions: []
            effects:
              - type: grant_clue
                clue_id: concentrated_harassment
              - type: set_flag
                flag: forus_safety_review_pending
                value: true
              - type: grant_evidence
                evidence_id: public_report_receipt
                initial_confidence: 1
              - type: increment_hidden_value
                value: platform_governance
                amount: 1
          - id: choice_argue_with_trend
            action_type: create_comment
            target_id: thread_trend_repost
            title: null
            body: 逐条替目标人物反驳，并引用她的学校和作品细节。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_admin_message
    sequence: 2
    title: 官方私信
    threads: []
    choice_sets: []
    direct_messages:
      - id: dm_forus_admin_review
        sender_id: forus_community_admin
        participant_ids: [player, forus_community_admin]
        visibility: private
        trigger_conditions:
          - type: flag_equals
            flag: forus_safety_review_pending
            value: true
        arrival: next_phase
        messages:
          - id: dm_forus_admin_review_message
            author_id: forus_community_admin
            body: 你好，这里是 Forus社区管理员。相关帖子已进入审核队列。请只提交公开链接和时间线，不要转发任何私信内容。
            timestamp: 11月9日 15:00
            state: unread
        choice_sets:
          - id: choices_forus_admin_review
            choices:
              - id: choice_request_protection
                action_type: reply_direct_message
                target_id: dm_forus_admin_review_message
                title: 请求账号保护
                body: 请先限制集中回复并隐藏目标人物的个人资料。
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: platform_governance
                    amount: 1
                  - type: increment_hidden_value
                    value: target_safety
                    amount: 1
              - id: choice_submit_public_material
                action_type: reply_direct_message
                target_id: dm_forus_admin_review_message
                title: 提交公开材料
                body: 我会整理公开帖子、时间线和举报回执，不提交任何私信。
                conditions: []
                effects:
                  - type: increase_evidence_confidence
                    evidence_id: public_report_receipt
                    amount: 1
                  - type: increment_hidden_value
                    value: platform_governance
                    amount: 1
    on_enter: []
    on_end: []
  - id: phase_03_branch_setup
    sequence: 3
    title: 主要分支形成
    threads: []
    choice_sets: []
    direct_messages: []
    on_enter: []
    on_end: []
summary:
  title: 平台是否介入
  body: 第五日结束时，事实材料、平台治理、目标安全和玩家暴露开始形成不同方向。
