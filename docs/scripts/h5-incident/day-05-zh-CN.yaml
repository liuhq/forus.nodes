meta:
  story_id: h5_incident
  day_id: day_05
  sequence: 5
  locale: zh-CN
  display_date: 11月9日
  interaction_limit: 3
  content_version: 2.0.0
  license: CC-BY-SA-4.0
  title: 交叉验证
  summary: 三条路线在同一组隔离实验中交汇，遗漏可补回但会失去深入验证机会。
  on_enter: []
  on_end:
    - type: start_encounter
      encounter_id: encounter_closed_consensus
  exits:
    - target_day_id: day_06
      conditions:
        - type: encounter_result
          encounter_id: encounter_closed_consensus
          result: victory
accounts:
  - id: feifeiyu_fishy
    username: "@飞飞鱼Fishy"
    role: editor
  - id: universal_official
    username: "@寰宇Universal"
    role: organization
  - id: mori
    username: "@Mori"
    role: community
clues: []
cards:
  - id: break_consensus
    name: 打破共识
    type: DisruptionCard
    cost: 1
    rules_text: 敌方影响力-2；若三条验证均完成，再抽1张。
    base_damage: 0
    effects: []
    keywords: []
    route_scope: shared
encounters:
  - id: encounter_closed_consensus
    name: 封闭共识
    player_stability: 30
    player_guard: 0
    player_influence: 0
    enemy_stability: 32
    enemy_guard: 4
    enemy_influence: 2
    enemy_pattern: [repeat_claim, copy_first_card, amplify]
    reward_choices: [break_consensus, isolated_voice, audit_chain]
    victory_effects:
      - type: set_flag
        flag: consensus_broken
        value: true
    defeat_effects: []
scenes:
  - id: scene_cross_validation
    entry_conditions: []
    threads:
      - id: thread_isolation_results
        board_id: xunsheng_gazette
        author_id: universal_official
        title: 三组隔离实验的原始结果
        body: |-
          第一组移除真人账号标识，第二组撤销跨城权限，第三组切断代行回复。聚合单元在第一组继续表达，在第二组无法写回，在第三组没有改变侵蚀边界。

          单看任何一组都能得出方便却不完整的结论，三组必须交叉核验。
        timestamp: 11月9日 11:30
        status: pinned
        comments:
          - id: comment_fishy_cross
            author_id: feifeiyu_fishy
            body: 今天可以补查遗漏，也可以把已有线索推进为最终验证；时间不足以两者都做。
            timestamp: 11月9日 11:38
            replies: []
            state: normal
    choice_sets:
      - id: choices_cross_validation
        choices:
          - id: choice_recover_identity
            action_type: create_reply
            target_id: comment_fishy_cross
            title: null
            body: 补查会话归属，先证明代行活动并非账号主人本人操作。
            tone: investigate
            conditions:
              - type: not
                condition:
                  type: has_clue
                  clue_id: non_person_session
            effects:
              - type: grant_clue
                clue_id: non_person_session
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_verify_identity
            action_type: create_comment
            target_id: thread_isolation_results
            title: null
            body: 比较空白账号与原账号回答，确认聚合单元能在不冒用真人身份时继续表达。
            tone: investigate
            conditions:
              - type: has_clue
                clue_id: non_person_session
            effects:
              - type: set_flag
                flag: identity_verified
                value: true
              - type: increment_counter
                counter: identity_progress
                amount: 1
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_recover_governance
            action_type: create_reply
            target_id: comment_fishy_cross
            title: null
            body: 补查原始签名，确认跨城部署字段曾被外部程序覆盖。
            tone: investigate
            conditions:
              - type: not
                condition:
                  type: has_clue
                  clue_id: overwritten_signature
            effects:
              - type: grant_clue
                clue_id: overwritten_signature
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_verify_governance
            action_type: create_comment
            target_id: thread_isolation_results
            title: null
            body: 重放完整权限链，确认撤销任何越权层都能阻止写回而不破坏公开档案。
            tone: investigate
            conditions:
              - type: has_clue
                clue_id: overwritten_signature
            effects:
              - type: set_flag
                flag: governance_verified
                value: true
              - type: increment_counter
                counter: governance_progress
                amount: 1
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_recover_survival
            action_type: create_reply
            target_id: comment_fishy_cross
            title: null
            body: 补齐代行启停前后的真实链接密度与侵蚀边界数据。
            tone: investigate
            conditions:
              - type: not
                condition:
                  type: has_clue
                  clue_id: link_density_shift
            effects:
              - type: grant_clue
                clue_id: link_density_shift
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_verify_survival
            action_type: create_comment
            target_id: thread_isolation_results
            title: null
            body: 分离回复数量、真人连接和侵蚀边界，证明 H-5 不能用单一密度指标代表城市存续。
            tone: investigate
            conditions:
              - type: has_clue
                clue_id: link_density_shift
            effects:
              - type: set_flag
                flag: survival_verified
                value: true
              - type: increment_counter
                counter: survival_progress
                amount: 1
            once: true
            narrative_scope: main
            interaction_cost: 1
    on_enter: []
    exits: []
