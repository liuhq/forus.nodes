meta:
  story_id: online_harassment_case
  day_id: day_03
  sequence: 3
  locale: en-US
  display_date: November 7
  title: Full Context or Silence
  summary: Complete drafts begin to appear. Whether the target trusts the player determines whether the timeline can be recovered.
  on_end: []
accounts:
  - id: target_student_17
    username: "@AfterStudyHall"
    role: target
  - id: source_keeper
    username: "@DraftKeeper"
    role: community
  - id: contest_observer
    username: "@ContestObserver"
    role: community
clues:
  - id: shared_draft_history
    name: Shared draft history
    description: The two students exchanged drafts; similarity alone does not prove theft.
evidence:
  - id: authorization_record
    name: Authorization record
    description: Public credit, exchange, and authorization records from the versions.
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_two_drafts
    sequence: 1
    title: Two drafts
    threads:
      - id: thread_two_drafts
        board_id: contest_watch
        author_id: source_keeper
        title: What is different between the drafts?
        body: One version shows that the two students exchanged design ideas; another has its date and credit line cut away.
        timestamp: November 7 09:00
        status: pinned
        comments: []
    choice_sets:
      - id: choices_two_drafts
        choices:
          - id: choice_compare_versions
            action_type: create_comment
            target_id: thread_two_drafts
            title: null
            body: Compare the complete versions first. This could be theft, collaboration, or a version error.
            conditions:
              - type: evidence_confidence_at_least
                evidence_id: draft_version
                confidence: 1
            effects:
              - type: grant_clue
                clue_id: shared_draft_history
              - type: grant_evidence
                evidence_id: authorization_record
                initial_confidence: 1
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_repeat_theft_claim
            action_type: react_agree
            target_id: thread_two_drafts
            title: Agree that it is theft
            body: null
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_accountability_boundary
    sequence: 2
    title: The boundary of accountability
    threads:
      - id: thread_accountability_boundary
        board_id: general_discussion
        author_id: contest_observer
        title: Does a mistake justify every consequence?
        body: Replies collapse “she should apologize” into “she should be publicly punished.”
        timestamp: November 7 13:30
        status: normal
        comments: []
    choice_sets:
      - id: choices_accountability_boundary
        choices:
          - id: choice_set_boundary
            action_type: create_reply
            target_id: thread_accountability_boundary
            title: null
            body: She needs to apologize for the wrong accusation, but that does not justify sharing her school and photos.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_accept_all_punishment
            action_type: create_reply
            target_id: thread_accountability_boundary
            title: null
            body: Since she was wrong, she should accept every consequence.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
          - id: choice_verify_first
            action_type: react_disagree
            target_id: thread_accountability_boundary
            title: Disagree with judging first
            body: null
            conditions: []
            effects:
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_03_branch_window
    sequence: 3
    title: The branch window
    threads: []
    choice_sets: []
    direct_messages:
      - id: dm_target_full_timeline
        sender_id: target_student_17
        participant_ids: [player, target_student_17]
        visibility: private
        trigger_conditions:
          - type: hidden_value_at_least
            value: target_safety
            amount: 2
        arrival: current_phase
        messages:
          - id: dm_target_full_timeline_message
            author_id: target_student_17
            body: I can tell you the full timeline, but please do not publish some of it. I did make the wrong call, and I apologized to her.
            timestamp: November 7 19:00
            state: unread
        choice_sets:
          - id: choices_target_full_timeline
            choices:
              - id: choice_respect_private_timeline
                action_type: reply_direct_message
                target_id: dm_target_full_timeline_message
                title: Respect the privacy boundary
                body: Tell me which material can be public and which must remain private.
                conditions: []
                effects:
                  - type: set_private_flag
                    flag: full_timeline_shared
                    value: true
                  - type: increment_hidden_value
                    value: target_safety
                    amount: 1
              - id: choice_pressure_total_disclosure
                action_type: reply_direct_message
                target_id: dm_target_full_timeline_message
                title: Demand full disclosure
                body: If you do not publish everything, people will not believe you.
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: target_safety
                    amount: -1
    on_enter: []
    on_end: []
summary:
  title: Full Context or Silence
  body: The player's handling of the third day determines whether the target continues to trust them.
