phases:
  - id: phase_01_safety_check
    sequence: 1
    title: The safety check
    threads:
      - id: thread_safety_check
        board_id: general_discussion
        author_id: source_keeper
        title: What matters most now?
        body: The public argument continues, but whether the target is safe is now more urgent than who was first to be wrong.
        timestamp: November 10 09:00
        status: pinned
        comments: []
    choice_sets:
      - id: choices_safety_check
        choices:
          - id: choice_prioritize_safety
            action_type: create_reply
            target_id: thread_safety_check
            title: null
            body: Stop the spread of personal information first. Contact trusted adults and real-world support so she is not facing the replies alone.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_prioritize_public_debate
            action_type: create_reply
            target_id: thread_safety_check
            title: null
            body: The priority is explaining everything while the attention is here.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_direction
    sequence: 2
    title: The direction forms
    threads: []
    choice_sets: []
    direct_messages:
      - id: dm_day06_direction
        sender_id: forus_community_admin
        participant_ids: [player, forus_community_admin]
        visibility: private
        trigger_conditions:
          - type: flag_equals
            flag: forus_safety_review_pending
            value: true
        arrival: next_phase
        messages:
          - id: dm_day06_direction_message
            author_id: forus_community_admin
            body: 我们已经看到集中回复和个人信息扩散。请确认你是否还会继续公开引用目标人物的私密内容。
            timestamp: November 10 15:20
            state: unread
        choice_sets:
          - id: choices_day06_direction
            choices:
              - id: choice_confirm_privacy
                action_type: reply_direct_message
                target_id: dm_day06_direction_message
                title: Confirm privacy
                body: I will not. I will submit only public links and a verified timeline.
                conditions: []
                effects:
                  - type: set_private_flag
                    flag: no_private_export
                    value: true
                  - type: increment_hidden_value
                    value: platform_governance
                    amount: 1
              - id: choice_continue_public_fight
                action_type: reply_direct_message
                target_id: dm_day06_direction_message
                title: Continue the public fight
                body: If everything is not public, the crowd will not stop.
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: player_exposure
                    amount: 1
    on_enter: []
    on_end: []
  - id: phase_03_path_marker
    sequence: 3
    title: The irreversible direction
    threads:
      - id: thread_path_marker
        board_id: contest_watch
        author_id: source_keeper
        title: Only one result will remain tomorrow
        body: After today, the player’s actions will determine whether the target is rescued, harassment is stopped, the target enters danger, or the player becomes the next target.
        timestamp: November 10 20:00
        status: pinned
        comments: []
    choice_sets:
      - id: choices_path_marker
        choices:
          - id: choice_acknowledge_rescue
            action_type: create_comment
            target_id: thread_path_marker
            title: Protect the target
            body: null
            conditions:
              - type: all
                conditions:
                  - type: hidden_value_at_least
                    value: target_safety
                    amount: 4
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: player_exposure
                      amount: 4
            effects:
              - type: set_flag
                flag: ending_path_target_rescue
                value: true
          - id: choice_acknowledge_stop
            action_type: create_comment
            target_id: thread_path_marker
            title: Let the platform review
            body: null
            conditions:
              - type: all
                conditions:
                  - type: hidden_value_at_least
                    value: truth_confidence
                    amount: 4
                  - type: hidden_value_at_least
                    value: platform_governance
                    amount: 3
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: player_exposure
                      amount: 4
            effects:
              - type: set_flag
                flag: ending_path_harassment_stop
                value: true
          - id: choice_acknowledge_player_risk
            action_type: create_comment
            target_id: thread_path_marker
            title: Keep fighting under your name
            body: null
            conditions:
              - type: hidden_value_at_least
                value: player_exposure
                amount: 4
            effects:
              - type: set_flag
                flag: ending_path_player_targeted
                value: true
          - id: choice_acknowledge_danger
            action_type: create_comment
            target_id: thread_path_marker
            title: Keep pushing the dispute upward
            body: null
            conditions:
              - type: all
                conditions:
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: target_safety
                      amount: 4
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: truth_confidence
                      amount: 4
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: platform_governance
                      amount: 3
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: player_exposure
                      amount: 4
            effects:
              - type: set_flag
                flag: ending_path_target_danger
                value: true
    direct_messages: []
    on_enter: []
    on_end: []
