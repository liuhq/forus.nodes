meta:
  story_id: online_harassment_case
  day_id: day_01
  sequence: 1
  locale: zh-CN
  display_date: 11月5日
  title: 错误指控出现
  summary: 一名高中女生曾公开指控同学盗用作品，帖子删除后，截图和个人信息开始扩散。
  on_end: []
accounts:
  - id: target_student_17
    username: "@晚自习后"
    role: target
  - id: source_keeper
    username: "@原稿保存者"
    role: community
  - id: cropped_context
    username: "@截屏的人"
    role: community
  - id: trend_reposter
    username: "@热榜搬运站"
    role: media
clues:
  - id: cropped_context
    name: 裁剪语境
    description: 流传截图缺少前后文和完整时间线。
  - id: target_admitted_error
    name: 私下承认错误
    description: 目标人物承认自己没有核实完整材料就公开指控。
evidence:
  - id: public_post_timeline
    name: 公开帖子时间线
    description: 原帖、删除和转发的公开时间记录。
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_help_post
    sequence: 1
    title: 求助帖
    threads:
      - id: thread_help_post
        board_id: contest_watch
        author_id: target_student_17
        title: 有人说我偷了作品
        body: |-
          我已经把之前的帖子删掉了。现在有人把一张截图发得到处都是，还说我一直在排挤别人。

          我知道我应该解释，但请不要把我的学校和照片一起发出去。
        timestamp: 11月5日 08:20
        status: pinned
        comments:
          - id: comment_privacy_support
            author_id: source_keeper
            body: 先停止传播个人信息。作品争议可以核对，学校和照片不应该成为围攻材料。
            timestamp: 11月5日 08:28
            replies: []
            state: normal
          - id: comment_demand_proof
            author_id: cropped_context
            body: 她删帖就是心虚，先把完整证据发出来再说。
            timestamp: 11月5日 08:31
            replies: []
            state: normal
    choice_sets:
      - id: choices_help_post
        choices:
          - id: choice_support_safety
            action_type: create_reply
            target_id: thread_help_post
            title: null
            body: 先确认你是否安全。你可以先说明需要什么帮助，不必立即证明自己清白。
            conditions: []
            effects:
              - type: set_flag
                flag: target_notice_pending
                value: true
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_demand_private_proof
            action_type: create_reply
            target_id: thread_help_post
            title: null
            body: 把完整截图和草稿发出来，我才能帮你解释。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
          - id: choice_agree_privacy
            action_type: react_agree
            target_id: comment_privacy_support
            title: 赞同保护隐私
            body: null
            conditions: []
            effects:
              - type: set_flag
                flag: target_notice_pending
                value: true
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_disagree_public_punishment
            action_type: react_disagree
            target_id: comment_demand_proof
            title: 反对公开审判
            body: null
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: 1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_screenshot_wave
    sequence: 2
    title: 截图开始流传
    threads:
      - id: thread_cropped_screenshot
        board_id: general_discussion
        author_id: cropped_context
        title: 她自己都承认了
        body: |-
          这段聊天记录已经说明她不是第一次这样做。别再替她找借口。

          帖子下方出现了目标人物的学校、照片和旧账号链接。
        timestamp: 11月5日 13:10
        status: normal
        comments: []
      - id: thread_trend_summary
        board_id: general_discussion
        author_id: trend_reposter
        title: 校园创作比赛争议汇总
        body: 只保留最容易传播的截图和评论，不提供完整作品版本。
        timestamp: 11月5日 15:00
        status: normal
        comments: []
    choice_sets:
      - id: choices_screenshot_wave
        choices:
          - id: choice_save_public_timeline
            action_type: create_comment
            target_id: thread_cropped_screenshot
            title: null
            body: 我先保存公开链接和时间线，不把个人信息继续复制到评论区。
            conditions: []
            effects:
              - type: grant_evidence
                evidence_id: public_post_timeline
                initial_confidence: 1
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_quote_screenshot
            action_type: create_reply
            target_id: thread_cropped_screenshot
            title: null
            body: 直接引用这段截图，要求她公开解释所有细节。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages:
      - id: dm_target_first_contact
        sender_id: target_student_17
        participant_ids: [player, target_student_17]
        visibility: private
        trigger_conditions:
          - type: flag_equals
            flag: target_notice_pending
            value: true
        arrival: next_phase
        messages:
          - id: dm_target_first_message
            author_id: target_student_17
            body: 你是刚才说“先确认我是否安全”的那个人吗？我不知道该不该把事情告诉你。
            timestamp: 11月5日 18:20
            state: unread
        choice_sets:
          - id: choices_target_first_contact
            choices:
              - id: choice_reply_check_safety
                action_type: reply_direct_message
                target_id: dm_target_first_message
                title: 先确认安全
                body: 你可以先告诉我现在是否安全，不必立即证明自己清白。
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: target_safety
                    amount: 1
                  - type: set_private_flag
                    flag: target_trust_started
                    value: true
              - id: choice_reply_request_proof
                action_type: reply_direct_message
                target_id: dm_target_first_message
                title: 先提供证据
                body: 把完整截图和草稿发给我，我才能帮你。
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: target_safety
                    amount: -1
              - id: choice_reply_private_boundary
                action_type: reply_direct_message
                target_id: dm_target_first_message
                title: 承诺保密
                body: 我不会把你的私信转发出去。
                conditions: []
                effects:
                  - type: set_private_flag
                    flag: private_boundary_respected
                    value: true
    on_enter: []
    on_end: []
  - id: phase_03_first_contact
    sequence: 3
    title: 第一次私信
    threads: []
    choice_sets: []
    direct_messages: []
    on_enter: []
    on_end: []
summary:
  title: 删除不等于澄清
  body: 目标人物的错误指控是真实事件，但流传截图和个人信息扩散已经超出责任讨论。
