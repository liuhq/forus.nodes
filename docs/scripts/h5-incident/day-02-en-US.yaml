        title: "Anomalous activity audit: neither account theft nor one account"
        body: |-
          The Gazette confirmed nine offline accounts checking in, replying, and voting on schedule. They seek no money and change no passwords. They only maintain “social activity.”

          Their sessions came through a maintenance route marked NC7, with its issuing subject overwritten. A source label is not yet a finding of responsibility.
        timestamp: November 6, 09:10
        status: pinned
        comments:
          - id: comment_forus_route
