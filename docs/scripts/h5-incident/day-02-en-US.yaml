meta:
  story_id: online_harassment_case
  day_id: day_02
  sequence: 2
  locale: en-US
  display_date: November 6
  title: Deletion Is Not Clarification
  summary: Deleting the post does not end the dispute. Public versions begin to reveal the missing timeline.
  on_end: []
accounts:
  - id: target_student_17
    username: "@AfterStudyHall"
    role: target
  - id: source_keeper
    username: "@DraftKeeper"
    role: community
  - id: contest_observer
    username: "@ContestObserver"
    role: community
clues:
  - id: draft_gap
    name: Missing draft context
    description: The circulating comparison omits an intermediate version and authorization context.
evidence:
  - id: draft_version
    name: Draft version record
    description: Public versions, timestamps, and credit records for the contest work.
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_deleted_post
    sequence: 1
    title: The deleted record
    threads:
      - id: thread_deleted_post
        board_id: contest_watch
        author_id: contest_observer
        title: Does deleting it prove guilt?
        body: The deletion time is being described as an admission. Cached copies of the post are still spreading.
        timestamp: November 6 08:40
        status: normal
        comments: []
    choice_sets:
      - id: choices_deleted_post
        choices:
          - id: choice_compare_delete_time
            action_type: create_comment
            target_id: thread_deleted_post
            title: null
            body: Deleting a post proves that she stopped spreading it, not that she admits every claim being made.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_agree_delete_guilt
            action_type: react_agree
            target_id: thread_deleted_post
            title: Agree that deletion proves guilt
            body: null
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_draft_records
    sequence: 2
    title: The version record
    threads:
      - id: thread_draft_records
        board_id: contest_watch
        author_id: source_keeper
        title: One page is still missing
        body: Public drafts show that the two students exchanged design ideas, but the authorization record is not organized yet.
        timestamp: November 6 12:20
        status: pinned
        comments: []
    choice_sets:
      - id: choices_draft_records
        choices:
          - id: choice_request_public_versions
            action_type: create_reply
            target_id: thread_draft_records
            title: null
            body: Organize the public versions and timeline first. Do not use private messages as public evidence.
            conditions: []
            effects:
              - type: grant_clue
                clue_id: draft_gap
              - type: grant_evidence
                evidence_id: draft_version
                initial_confidence: 1
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_amplify_accusation
            action_type: create_reply
            target_id: thread_draft_records
            title: null
            body: Since she deleted the post, she should apologize publicly before discussing versions.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages:
      - id: dm_target_admission
        sender_id: target_student_17
        participant_ids: [player, target_student_17]
        visibility: private
        trigger_conditions:
          - type: private_flag_equals
            flag: private_boundary_respected
            value: true
        arrival: next_phase
        messages:
          - id: dm_target_admission_message
            author_id: target_student_17
            body: I did think she stole the work. I posted before checking everything, apologized privately, and was afraid to say so publicly.
            timestamp: November 6 19:10
            state: unread
        choice_sets:
          - id: choices_target_admission
            choices:
              - id: choice_accept_accountability
                action_type: reply_direct_message
                target_id: dm_target_admission_message
                title: Set an accountability boundary
                body: You need to apologize for the wrong accusation, but that does not give anyone permission to spread your personal information.
                conditions: []
                effects:
                  - type: set_private_flag
                    flag: target_accountability_acknowledged
                    value: true
                  - type: increment_hidden_value
                    value: target_safety
                    amount: 1
              - id: choice_pressure_public_apology
                action_type: reply_direct_message
                target_id: dm_target_admission_message
                title: Demand an immediate public apology
                body: You should publish every private detail now so people will believe you.
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: target_safety
                    amount: -1
    on_enter: []
    on_end: []
summary:
  title: Deletion Is Not Clarification
  body: The target did make a mistake, but the complete version still requires public verification.
