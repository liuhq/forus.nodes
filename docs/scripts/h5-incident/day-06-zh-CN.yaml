meta:
  story_id: online_harassment_case
  day_id: day_06
  sequence: 6
  locale: zh-CN
  display_date: 11月10日
  title: 不可逆方向
  summary: 目标安全、事实可信度、平台治理和玩家暴露在今天形成不可逆的结局方向。
  on_end: []
accounts:
  - id: target_student_17
    username: "@晚自习后"
    role: target
  - id: forus_community_admin
    username: "@Forus社区管理员"
    role: official
  - id: source_keeper
    username: "@原稿保存者"
    role: community
clues: []
evidence: []
direct_messages: []
phases:
  - id: phase_01_safety_check
    sequence: 1
    title: 安全确认
    threads:
      - id: thread_safety_check
        board_id: general_discussion
        author_id: source_keeper
        title: 现在最重要的是什么
        body: 公开讨论仍在继续，但目标人物是否安全已经比争论谁先说错更紧急。
        timestamp: 11月10日 09:00
        status: pinned
        comments: []
    choice_sets:
      - id: choices_safety_check
        choices:
          - id: choice_prioritize_safety
            action_type: create_reply
            target_id: thread_safety_check
            title: null
            body: 先停止个人信息扩散，联系可信成年人和现实支持，不让她独自面对评论区。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_prioritize_public_debate
            action_type: create_reply
            target_id: thread_safety_check
            title: null
            body: 现在最重要的是把所有争议一次说清楚，不能让热度过去。
            conditions: []
            effects:
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_direction
    sequence: 2
    title: 方向形成
    threads: []
    choice_sets: []
    direct_messages:
      - id: dm_day06_direction
        sender_id: forus_community_admin
        participant_ids: [player, forus_community_admin]
        visibility: private
        trigger_conditions:
          - type: flag_equals
            flag: forus_safety_review_pending
            value: true
        arrival: next_phase
        messages:
          - id: dm_day06_direction_message
            author_id: forus_community_admin
            body: 我们已经看到集中回复和个人信息扩散。请确认你是否还会继续公开引用目标人物的私密内容。
            timestamp: 11月10日 15:20
            state: unread
        choice_sets:
          - id: choices_day06_direction
            choices:
              - id: choice_confirm_privacy
                action_type: reply_direct_message
                target_id: dm_day06_direction_message
                title: 确认不外传
                body: 不会。我只提交公开链接和经过核对的时间线。
                conditions: []
                effects:
                  - type: set_private_flag
                    flag: no_private_export
                    value: true
                  - type: increment_hidden_value
                    value: platform_governance
                    amount: 1
              - id: choice_continue_public_fight
                action_type: reply_direct_message
                target_id: dm_day06_direction_message
                title: 继续公开争论
                body: 如果不把所有内容公开，围观者不会停止。
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: player_exposure
                    amount: 1
    on_enter: []
    on_end: []
  - id: phase_03_path_marker
    sequence: 3
    title: 不可逆方向
    threads:
      - id: thread_path_marker
        board_id: contest_watch
        author_id: source_keeper
        title: 明天只会留下一个结果
        body: 今天之后，玩家的行为会决定目标人物获救、网暴被制止、目标人物进入危险结局，或玩家自己成为下一个目标。
        timestamp: 11月10日 20:00
        status: pinned
        comments: []
    choice_sets:
      - id: choices_path_marker
        choices:
          - id: choice_acknowledge_rescue
            action_type: create_comment
            target_id: thread_path_marker
            title: 保护目标人物
            body: null
            conditions:
              - type: all
                conditions:
                  - type: hidden_value_at_least
                    value: target_safety
                    amount: 4
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: player_exposure
                      amount: 4
            effects:
              - type: set_flag
                flag: ending_path_target_rescue
                value: true
          - id: choice_acknowledge_stop
            action_type: create_comment
            target_id: thread_path_marker
            title: 交给平台复核
            body: null
            conditions:
              - type: all
                conditions:
                  - type: hidden_value_at_least
                    value: truth_confidence
                    amount: 4
                  - type: hidden_value_at_least
                    value: platform_governance
                    amount: 3
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: player_exposure
                      amount: 4
            effects:
              - type: set_flag
                flag: ending_path_harassment_stop
                value: true
          - id: choice_acknowledge_player_risk
            action_type: create_comment
            target_id: thread_path_marker
            title: 继续实名对抗
            body: null
            conditions:
              - type: hidden_value_at_least
                value: player_exposure
                amount: 4
            effects:
              - type: set_flag
                flag: ending_path_player_targeted
                value: true
          - id: choice_acknowledge_danger
            action_type: create_comment
            target_id: thread_path_marker
            title: 继续把争议推上热榜
            body: null
            conditions:
              - type: all
                conditions:
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: target_safety
                      amount: 4
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: truth_confidence
                      amount: 4
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: platform_governance
                      amount: 3
                  - type: not
                    condition:
                      type: hidden_value_at_least
                      value: player_exposure
                      amount: 4
            effects:
              - type: set_flag
                flag: ending_path_target_danger
                value: true
    direct_messages: []
    on_enter: []
    on_end: []
summary:
  title: 不可逆方向
  body: 第六日结束时，结局方向已经形成，第七日只会呈现其后果。
