meta:
  story_id: online_harassment_case
  day_id: day_01
  sequence: 1
  locale: en-US
  display_date: November 5
  title: The Wrong Accusation Appears
  summary: A high-school girl once accused a classmate of stealing a design. After she deleted the post, screenshots and personal information began spreading.
  on_end: []
accounts:
  - id: target_student_17
    username: "@AfterStudyHall"
    role: target
  - id: source_keeper
    username: "@DraftKeeper"
    role: community
  - id: cropped_context
    username: "@ScreenshotDrop"
    role: community
  - id: trend_reposter
    username: "@TrendRelay"
    role: media
clues:
  - id: cropped_context
    name: Cropped context
    description: The circulating screenshot is missing its surrounding messages and full timeline.
  - id: target_admitted_error
    name: Private admission
    description: The target admits she publicly accused someone before checking the complete material.
evidence:
  - id: public_post_timeline
    name: Public post timeline
    description: Public timestamps for the original post, deletion, and reposts.
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_help_post
    sequence: 1
    title: The help post
    threads:
      - id: thread_help_post
        board_id: contest_watch
        author_id: target_student_17
        title: They say I stole the work
        body: |-
          I deleted the earlier post. Now people are sharing a screenshot everywhere and saying I have always excluded others.

          I know I should explain, but please do not share my school or photos.
        timestamp: November 5 08:20
        status: pinned
        comments:
          - id: comment_privacy_support
            author_id: source_keeper
            body: Stop spreading personal information first. The work dispute can be checked; a school and a photo are not evidence.
            timestamp: November 5 08:28
            replies: []
            state: normal
          - id: comment_demand_proof
            author_id: cropped_context
            body: Deleting the post proves she is hiding something. She should publish everything first.
            timestamp: November 5 08:31
            replies: []
            state: normal
    choice_sets:
      - id: choices_help_post
        choices:
          - id: choice_support_safety
            action_type: create_reply
            target_id: thread_help_post
            title: null
            body: Check that you are safe first. You can say what help you need without proving your innocence immediately.
            conditions: []
            effects:
              - type: set_flag
                flag: target_notice_pending
                value: true
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_demand_private_proof
            action_type: create_reply
            target_id: thread_help_post
            title: null
            body: Send the complete screenshots and drafts so I can help explain this.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: -1
          - id: choice_agree_privacy
            action_type: react_agree
            target_id: comment_privacy_support
            title: Agree to protect privacy
            body: null
            conditions: []
            effects:
              - type: set_flag
                flag: target_notice_pending
                value: true
              - type: increment_hidden_value
                value: target_safety
                amount: 1
          - id: choice_disagree_public_punishment
            action_type: react_disagree
            target_id: comment_demand_proof
            title: Disagree with public punishment
            body: null
            conditions: []
            effects:
              - type: increment_hidden_value
                value: target_safety
                amount: 1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_screenshot_wave
    sequence: 2
    title: The screenshot spreads
    threads:
      - id: thread_cropped_screenshot
        board_id: general_discussion
        author_id: cropped_context
        title: She admitted it herself
        body: |-
          This chat proves she has done this before. Stop making excuses for her.

          Replies begin posting the target's school, photos, and old account links.
        timestamp: November 5 13:10
        status: normal
        comments: []
      - id: thread_trend_summary
        board_id: general_discussion
        author_id: trend_reposter
        title: Campus art contest controversy
        body: A summary post keeps only the most shareable screenshots and comments, with no complete versions of the work.
        timestamp: November 5 15:00
        status: normal
        comments: []
    choice_sets:
      - id: choices_screenshot_wave
        choices:
          - id: choice_save_public_timeline
            action_type: create_comment
            target_id: thread_cropped_screenshot
            title: null
            body: I will save the public links and timeline first, without copying personal information into the replies.
            conditions: []
            effects:
              - type: grant_evidence
                evidence_id: public_post_timeline
                initial_confidence: 1
              - type: increment_hidden_value
                value: truth_confidence
                amount: 1
          - id: choice_quote_screenshot
            action_type: create_reply
            target_id: thread_cropped_screenshot
            title: null
            body: Quote the screenshot directly and demand that she explain every detail.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages:
      - id: dm_target_first_contact
        sender_id: target_student_17
        participant_ids: [player, target_student_17]
        visibility: private
        trigger_conditions:
          - type: flag_equals
            flag: target_notice_pending
            value: true
        arrival: next_phase
        messages:
          - id: dm_target_first_message
            author_id: target_student_17
            body: Are you the person who said, “Check that I am safe” first? I do not know whether I should tell you what happened.
            timestamp: November 5 18:20
            state: unread
        choice_sets:
          - id: choices_target_first_contact
            choices:
              - id: choice_reply_check_safety
                action_type: reply_direct_message
                target_id: dm_target_first_message
                title: Check safety first
                body: Tell me whether you are safe first. You do not have to prove your innocence immediately.
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: target_safety
                    amount: 1
                  - type: set_private_flag
                    flag: target_trust_started
                    value: true
              - id: choice_reply_request_proof
                action_type: reply_direct_message
                target_id: dm_target_first_message
                title: Ask for proof first
                body: Send me the complete screenshots and drafts so I can help you.
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: target_safety
                    amount: -1
              - id: choice_reply_private_boundary
                action_type: reply_direct_message
                target_id: dm_target_first_message
                title: Promise privacy
                body: I will not forward your private messages.
                conditions: []
                effects:
                  - type: set_private_flag
                    flag: private_boundary_respected
                    value: true
    on_enter: []
    on_end: []
  - id: phase_03_first_contact
    sequence: 3
    title: The first message
    threads: []
    choice_sets: []
    direct_messages: []
    on_enter: []
    on_end: []
summary:
  title: Deletion is not clarification
  body: The wrong accusation is real, but the spreading screenshot and personal information have already gone beyond accountability.
