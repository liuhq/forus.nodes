meta:
  story_id: online_harassment_case
  day_id: day_05
  sequence: 5
  locale: en-US
  display_date: November 9
  title: Will the Platform Intervene?
  summary: The trending page rewrites a wrong accusation as “proof of a repeat offender.” The player decides whether to give public material to Forus.
  on_end: []
accounts:
  - id: trend_reposter
    username: "@TrendRelay"
    role: media
  - id: contest_observer
    username: "@ContestObserver"
    role: community
  - id: forus_community_admin
    username: "@Forus社区管理员"
    role: official
clues:
  - id: concentrated_harassment
    name: Concentrated harassment
    description: Multiple posts repeat the same accusation and spread personal information within a short period.
evidence:
  - id: public_report_receipt
    name: Public report receipt
    description: Forus records of public reports, links, and handling times.
    max_confidence: 3
direct_messages: []
phases:
  - id: phase_01_trend_repost
    sequence: 1
    title: The trend relay
    threads:
      - id: thread_trend_repost
        board_id: general_discussion
        author_id: trend_reposter
        title: Complete campus art controversy summary
        body: The headline rewrites “wrong accusation” as “proof of a repeat offender,” and replies multiply quickly.
        timestamp: November 9 09:20
        status: pinned
        comments: []
    choice_sets:
      - id: choices_trend_repost
        choices:
          - id: choice_report_concentrated_harassment
            action_type: create_reply
            target_id: thread_trend_repost
            title: null
            body: This is no longer an ordinary argument. Record the public links showing concentrated abuse and personal information spreading.
            conditions: []
            effects:
              - type: grant_clue
                clue_id: concentrated_harassment
              - type: set_flag
                flag: forus_safety_review_pending
                value: true
              - type: grant_evidence
                evidence_id: public_report_receipt
                initial_confidence: 1
              - type: increment_hidden_value
                value: platform_governance
                amount: 1
          - id: choice_argue_with_trend
            action_type: create_comment
            target_id: thread_trend_repost
            title: null
            body: Argue for the target point by point, quoting her school and work details.
            conditions: []
            effects:
              - type: increment_hidden_value
                value: player_exposure
                amount: 1
              - type: increment_hidden_value
                value: target_safety
                amount: -1
    direct_messages: []
    on_enter: []
    on_end: []
  - id: phase_02_admin_message
    sequence: 2
    title: The official message
    threads: []
    choice_sets: []
    direct_messages:
      - id: dm_forus_admin_review
        sender_id: forus_community_admin
        participant_ids: [player, forus_community_admin]
        visibility: private
        trigger_conditions:
          - type: flag_equals
            flag: forus_safety_review_pending
            value: true
        arrival: next_phase
        messages:
          - id: dm_forus_admin_review_message
            author_id: forus_community_admin
            body: 你好，这里是 Forus社区管理员。相关帖子已进入审核队列。请只提交公开链接和时间线，不要转发任何私信内容。
            timestamp: November 9 15:00
            state: unread
        choice_sets:
          - id: choices_forus_admin_review
            choices:
              - id: choice_request_protection
                action_type: reply_direct_message
                target_id: dm_forus_admin_review_message
                title: Request account protection
                body: Please limit concentrated replies first and hide the target’s profile information.
                conditions: []
                effects:
                  - type: increment_hidden_value
                    value: platform_governance
                    amount: 1
                  - type: increment_hidden_value
                    value: target_safety
                    amount: 1
              - id: choice_submit_public_material
                action_type: reply_direct_message
                target_id: dm_forus_admin_review_message
                title: Submit public material
                body: I will organize public posts, timelines, and report receipts, without submitting any private messages.
                conditions: []
                effects:
                  - type: increase_evidence_confidence
                    evidence_id: public_report_receipt
                    amount: 1
                  - type: increment_hidden_value
                    value: platform_governance
                    amount: 1
    on_enter: []
    on_end: []
  - id: phase_03_branch_setup
    sequence: 3
    title: The main branches form
    threads: []
    choice_sets: []
    direct_messages: []
    on_enter: []
    on_end: []
summary:
  title: Will the Platform Intervene?
  body: By the end of day five, facts, platform action, target safety, and player exposure begin to form separate directions.
