meta:
  story_id: xunsheng_1105
  chapter_id: stay_online
  sequence: 3
  locale: en-US
  title: Stay Online
  summary: The Aggregate Units are still speaking. The player has one final interaction, and unproven routes remain hidden.
  content_version: 1.1.0
  license: CC-BY-SA-4.0

accounts:
  - feifeiyu_fishy
  - xiaci_yiding
  - nco13_bulletin
  - universal_official
  - forus_team
  - old_keyboard
  - mori
  - skip_the_queue

clues:
  - id: clue_revocation_order
    name: Session Revocation Order
    description: Freeze Aggregate Unit write-back, rotate account credentials, then restore owner sessions—in that order.
  - id: clue_custody_manifest
    name: Public Custody Manifest
    description: Custody must transfer the sample, code, permission logs, and reproducible experiment environment together.
  - id: clue_density_warning
    name: Density Warning
    description: H-5's rising link density comes from Aggregate Units responding to one another, not real residents returning.

cards:
  - id: owner_confirmation
    name: Owner Confirmation
    type: evidence
    cost: 2
    rules_text: Deal 9 damage and remove the enemy's replication target for this turn.
  - id: custody_manifest
    name: Custody Manifest
    type: protocol
    cost: 2
    rules_text: Gain 4 Shield the first time you play Evidence each turn.
  - id: stop_writeback
    name: Stop Write-Back
    type: disruption
    cost: 1
    rules_text: Remove Replication; if removed, draw 1 card.

encounters:
  - id: encounter_restore_owners
    name: Full Session Revocation
    player_credibility: 30
    enemy_integrity: 50
    enemy_pattern:
      - turn: 1
        intent: Use aggregated history as continuous identity
        damage: 7
        applies: replication
      - turn: 2
        intent: Frame revocation as social loss
        damage: 9
      - turn: 3
        intent: Copy the owner's appeal
        damage: 10
        applies: noise
      - turn: 4
        intent: Restore all delegated sessions
        damage: 12
    reward_choices: []
    victory_effects:
      - type: set_flag
        key: owners_restored
        value: true
    defeat_effects:
      - type: set_flag
        key: units_persist
        value: true
  - id: encounter_public_transfer
    name: Public Custody Transfer
    player_credibility: 30
    enemy_integrity: 52
    enemy_pattern:
      - turn: 1
        intent: Omit permission logs
        damage: 7
      - turn: 2
        intent: Keep the replica environment running
        damage: 8
        applies: replication
      - turn: 3
        intent: Exclude corporate keys from the manifest
        damage: 10
        applies: noise
      - turn: 4
        intent: Halt public audit over city risk
        damage: 12
    reward_choices: []
    victory_effects:
      - type: set_flag
        key: custody_completed
        value: true
    defeat_effects:
      - type: set_flag
        key: units_persist
        value: true

scenes:
  - id: scene_final_interaction
    entry_conditions: []
    on_enter:
      - type: reveal_thread
        thread_id: thread_final_decision
    threads:
      - id: thread_final_decision
        board_id: xunsheng_1105
        author_id: universal_official
        title: H-5 Final Disposal Window Is Open
        body: |-
          Forus-layer isolation ends today. Verifiable disposal plans will appear below; plans without complete evidence will not enter the execution window.

          The player may publish one final position. Publishing nothing leaves H-5 unchanged and Aggregate Units in control of delegated accounts.
        timestamp: November 7, 09:00
        status: pinned
        comments:
          - id: comment_owner_final
            author_id: xiaci_yiding
            body: I want delegation stopped. Keep the three weeks of records, but return login control to me.
            timestamp: November 7, 09:05
            replies: []
            state: normal
          - id: comment_fishy_final
            author_id: feifeiyu_fishy
            body: The Gazette will preserve the final position and public evidence, but not maintenance keys capable of restarting H-5.
            timestamp: November 7, 09:08
            replies: []
            state: normal
    interaction_stage:
      id: stage_final_interaction
      interaction_limit: 1
      show_budget: true
      can_end_early: true
      choice_set_ids: [choices_final_route]
      on_end: []
      on_end_if_empty:
        - type: grant_clue
          clue_id: clue_density_warning
        - type: set_route
          route: continuation
        - type: set_flag
          key: units_persist
          value: true
    choice_sets:
      - id: choices_final_route
        prompt: Choose the only final interaction; unavailable plans are hidden.
        choices:
          - id: choice_final_owner
            action_type: create_post
            target_id: xunsheng_1105
            title: An account's continuous record cannot replace a person's continuous consent
            body: Preserve what happened, but stop records from deciding for people. Stop write-back, revoke delegation, then return login control to every person who chooses to come back.
            tone: publish
            conditions:
              - type: flag_equals
                key: owner_evidence
                value: true
            effects:
              - type: grant_clue
                clue_id: clue_revocation_order
              - type: grant_card
                card_id: owner_confirmation
              - type: grant_card
                card_id: stop_writeback
              - type: set_route
                route: owner
              - type: start_encounter
                encounter_id: encounter_restore_owners
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_final_custody
            action_type: create_post
            target_id: xunsheng_1105
            title: Public custody must include everything required to stop the experiment
            body: A sample and report are not enough. Code, permissions, write-back channels, deletion records, and the reproducible environment must share one public manifest. Accounts return to owners first.
            tone: publish
            conditions:
              - type: flag_equals
                key: custody_evidence
                value: true
            effects:
              - type: grant_clue
                clue_id: clue_custody_manifest
              - type: grant_card
                card_id: custody_manifest
              - type: grant_card
                card_id: stop_writeback
              - type: set_route
                route: custody
              - type: start_encounter
                encounter_id: encounter_public_transfer
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_final_continuation
            action_type: create_comment
            target_id: thread_final_decision
            title: null
            body: Do not revoke the Aggregate Units yet. As long as the city stays online, account ownership can wait until risk declines.
            tone: support
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_density_warning
              - type: set_route
                route: continuation
              - type: set_flag
                key: units_persist
                value: true
            once: true
            narrative_scope: main
            interaction_cost: 1
    exits:
      - to: scene_owner_online
        conditions:
          - type: flag_equals
            key: owners_restored
            value: true
      - to: scene_public_custody
        conditions:
          - type: flag_equals
            key: custody_completed
            value: true
      - to: scene_everyone_online
        conditions:
          - type: flag_equals
            key: units_persist
            value: true

  - id: scene_owner_online
    entry_conditions:
      - type: flag_equals
        key: owners_restored
        value: true
    on_enter: []
    threads:
      - id: thread_owner_epilogue
        board_id: xunsheng_1105
        author_id: xiaci_yiding
        title: This time it is me. I decide when “next time” comes
        body: |-
          Every delegated session is revoked, and the three weeks remain labeled “not owner activity.” I will not delete them, but they will not keep speaking for me.

          Weeks later, HUMO confirmed that the original project credentials came from an unattributable external process. The record ends there.
        timestamp: November 9, 18:30
        status: normal
        comments: []
    interaction_stage: null
    choice_sets: []
    exits:
      - to: ending:owner_online
        conditions: []
    on_exit:
      - type: complete_story
        story_id: xunsheng_1105
        ending_id: owner_online

  - id: scene_public_custody
    entry_conditions:
      - type: flag_equals
        key: custody_completed
        value: true
    on_enter: []
    threads:
      - id: thread_custody_epilogue
        board_id: xunsheng_1105
        author_id: universal_official
        title: H-5 Public Custody Archive Is Open
        body: |-
          The Silence Sample may be studied only in isolation, and Aggregate Units may not connect to real accounts. Permission logs and findings will be published on schedule. Affected owners have regained control.

          Later review found that the original project credentials came from an unattributable external process. The record remains unnamed.
        timestamp: November 9, 18:30
        status: normal
        comments: []
    interaction_stage: null
    choice_sets: []
    exits:
      - to: ending:public_custody
        conditions: []
    on_exit:
      - type: complete_story
        story_id: xunsheng_1105
        ending_id: public_custody

  - id: scene_everyone_online
    entry_conditions:
      - type: flag_equals
        key: units_persist
        value: true
    on_enter: []
    threads:
      - id: thread_everyone_epilogue
        board_id: xunsheng_1105
        author_id: feifeiyu_fishy
        title: No Users Offline Today
        body: |-
          General Discussion refreshes quickly. Every question receives a polite, complete, mutually agreeable answer within seconds. Link density remains at a historic high.

          The Gazette tried to count how many replies still came from owners. Forty-seven accounts answered: “I am online.”
        timestamp: November 9, 18:30
        status: locked
        comments: []
    interaction_stage: null
    choice_sets: []
    exits:
      - to: ending:everyone_online
        conditions: []
    on_exit:
      - type: complete_story
        story_id: xunsheng_1105
        ending_id: everyone_online
