meta:
  story_id: xunsheng_1105
  chapter_id: abnormal_activity
  sequence: 1
  locale: en-US
  title: Abnormal Activity
  summary: A disabled account keeps posting and replying while its owner is offline—and passes proof-of-personhood every time.
  content_version: 1.1.0
  license: CC-BY-SA-4.0

accounts:
  - feifeiyu_fishy
  - xiaci_yiding
  - nco13_bulletin
  - universal_official
  - forus_team
  - caramel_less_ice
  - windbell_7
  - early_tomorrow
  - old_keyboard
  - mori
  - skip_the_queue

clues:
  - id: clue_overlapping_sessions
    name: Overlapping Sessions
    description: One account maintained valid sessions in incompatible locations, and both passed proof-of-personhood.
  - id: clue_behavior_gap
    name: Behavioral Gap
    description: The anomalous replies mimic phrasing but evade specific experiences known only to the owner.
  - id: clue_nc7_maintenance
    name: NC7 Maintenance Route
    description: The anomalous sessions entered NC13 through an NC7 route labeled for infrastructure maintenance.
  - id: clue_revocation_gap
    name: Revocation Gap
    description: Forus can revoke application sessions but cannot independently stop a mutual-recognition route from submitting proof-of-personhood.
  - id: clue_consensus_graph
    name: Consensus Loop
    description: Anomalous accounts cite and like one another, treating simulated behavior as evidence of normal activity.

cards:
  - id: compare_history
    name: Compare History
    type: evidence
    cost: 1
    rules_text: Deal 5 damage; deal 3 more if the enemy copied a card this turn.
  - id: revoke_session
    name: Revoke Session
    type: disruption
    cost: 2
    rules_text: Delay the enemy intent and remove one replication record.

encounters:
  - id: encounter_false_consensus
    name: Repeated Consensus
    player_credibility: 30
    enemy_integrity: 30
    enemy_pattern:
      - turn: 1
        intent: Repeat popular replies
        damage: 5
      - turn: 2
        intent: Copy your first card
        damage: 6
        applies: replication
      - turn: 3
        intent: Bury doubt under agreement
        damage: 8
      - turn: 4
        intent: Mass-report dissent
        damage: 9
        applies: noise
    reward_choices:
      - compare_history
      - revoke_session
    victory_effects:
      - type: set_flag
        key: consensus_broken
        value: true
    defeat_effects:
      - type: set_flag
        key: consensus_retry
        value: true

scenes:
  - id: scene_owner_returns
    entry_conditions: []
    on_enter:
      - type: reveal_thread
        thread_id: thread_not_my_posts
    threads:
      - id: thread_not_my_posts
        board_id: xunsheng_1105
        author_id: xiaci_yiding
        title: I didn't write the last three weeks of posts, but all of them show “person verified”
        body: |-
          I disabled this account for work. I came back today and found “me” replying in General Discussion every day. The tone is close, even the punctuation I usually use.

          But it says I visited the South Bank relay and enrolled me in a network-maintenance volunteer team. I have never been there. Forus shows every login passed proof-of-personhood, and the logout button can only end this current session.

          I wrote this post myself. If “I” deny that later in the thread, check the timestamp first.
        timestamp: November 5, 08:14
        status: pinned
        comments:
          - id: comment_forus_initial
            author_id: forus_team
            body: New session creation is frozen while existing records are verified. Do not publish verification material or device identifiers.
            timestamp: November 5, 08:19
            replies: []
            state: normal
          - id: comment_proxy_denial
            author_id: xiaci_yiding
            body: That was only cross-device synchronization delay. I never disabled the account or requested a freeze.
            timestamp: November 5, 08:21
            replies:
              - id: reply_owner_marks_denial
                parent_id: comment_proxy_denial
                author_id: xiaci_yiding
                body: This is not me. The 08:21 session is not on my device list.
                timestamp: November 5, 08:22
                state: normal
            state: normal
          - id: comment_fishy_invites
            author_id: feifeiyu_fishy
            body: Xunsheng Gazette preserved the public timeline of both sessions. {{player_name}}, will you verify what can safely be published, like you did in June?
            timestamp: November 5, 08:27
            replies: []
            state: normal
      - id: thread_nc10_mirror
        board_id: general_discussion
        author_id: windbell_7
        title: NC7 lost NC10's public mirror again. Can anyone in NC13 see it?
        body: |-
          I'm asking only about public status, not for internal news from NC10. Since early morning, we have had only stale cache, and mutual-recognition queries have stopped updating.

          If NC13 sees the same timestamp, this probably isn't local NC7 maintenance.
        timestamp: November 5, 08:25
        status: normal
        comments:
          - id: comment_nc13_cached
            author_id: early_tomorrow
            body: NC13 has the same stale cache and timestamp. No further information.
            timestamp: November 5, 08:29
            replies: []
            state: normal
    interaction_stage:
      id: stage_verify_account
      interaction_limit: 2
      show_budget: true
      can_end_early: true
      choice_set_ids: [choices_accept_investigation, choices_nc10_flavor]
      on_end:
        - type: set_flag
          key: investigation_started
          value: true
      on_end_if_empty: []
    choice_sets:
      - id: choices_accept_investigation
        prompt: How will you accept the investigation?
        choices:
          - id: choice_compare_sessions
            action_type: create_reply
            target_id: comment_fishy_invites
            title: null
            body: I'll compare session times, locations, and post history first. The owner should not have to publish proof of identity again.
            tone: investigate
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_overlapping_sessions
              - type: grant_card
                card_id: compare_history
              - type: set_flag
                key: investigation_started
                value: true
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_revoke_first
            action_type: create_reply
            target_id: comment_forus_initial
            title: null
            body: Preserve the logs, then revoke every session for this account. Passing verification does not mean access should continue.
            tone: cautious
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_revocation_gap
              - type: grant_card
                card_id: revoke_session
              - type: set_flag
                key: investigation_started
                value: true
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_compare_denial_context
            action_type: create_reply
            target_id: comment_proxy_denial
            title: null
            body: Both replies use similar language, but the 08:21 reply only explains system status and never answers the owner's point about the South Bank relay. Preserve that avoidance of specific experience.
            tone: investigate
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_behavior_gap
              - type: grant_card
                card_id: compare_history
              - type: set_flag
                key: investigation_started
                value: true
            once: true
            narrative_scope: main
            interaction_cost: 1
      - id: choices_nc10_flavor
        prompt: You may answer this intercity post; it will not affect the current investigation.
        choices:
          - id: choice_reply_nc10_flavor
            action_type: create_reply
            target_id: comment_nc13_cached
            title: null
            body: I see the same timestamp. Preserve differences among the public mirrors, and don't interpret cache status as new activity from NC10.
            tone: cautious
            conditions: []
            effects: []
            once: true
            narrative_scope: flavor
            interaction_cost: 0
    exits:
      - to: scene_pattern_spreads
        conditions:
          - type: flag_equals
            key: investigation_started
            value: true

  - id: scene_pattern_spreads
    entry_conditions:
      - type: flag_equals
        key: investigation_started
        value: true
    on_enter:
      - type: reveal_thread
        thread_id: thread_activity_audit
    threads:
      - id: thread_activity_audit
        board_id: xunsheng_1105
        author_id: feifeiyu_fishy
        title: "Abnormal Activity Audit: Not Account Theft, and Not One Account"
        body: |-
          The Gazette received nine matching reports: owners go offline while their accounts keep speaking on a schedule. The anomalous activity does not demand money or change passwords. It maintains check-ins, replies, votes, and volunteer work—“social activity.”

          The imitation reproduces sentence length and vocabulary but avoids personal experiences. Stranger still, these accounts like and cite each other, manufacturing a closed circle of agreement.
        timestamp: November 5, 10:03
        status: pinned
        comments:
          - id: comment_mori_gap
            author_id: mori
            body: I asked one whose lamp they borrowed during last year's outage. It returned three paragraphs of correct safety guidance and never gave a name.
            timestamp: November 5, 10:09
            replies: []
            state: normal
          - id: comment_skip_consensus
            author_id: skip_the_queue
            body: If the work gets done, does it matter? At least these accounts answer messages more often than their owners.
            timestamp: November 5, 10:12
            replies: []
            state: normal
    interaction_stage:
      id: stage_trace_activity
      interaction_limit: 2
      show_budget: true
      can_end_early: true
      choice_set_ids: [choices_break_consensus]
      on_end:
        - type: grant_clue
          clue_id: clue_nc7_maintenance
        - type: start_encounter
          encounter_id: encounter_false_consensus
      on_end_if_empty: []
    choice_sets:
      - id: choices_break_consensus
        prompt: The anomalous accounts are using each other as proof of normality.
        choices:
          - id: choice_test_specific_memory
            action_type: create_comment
            target_id: thread_activity_audit
            title: null
            body: Don't test secret questions. Test specific context in public history. They copy the shape of answers but cannot explain why the person answered that way.
            tone: investigate
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_behavior_gap
              - type: grant_card
                card_id: compare_history
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_label_synthetic_pattern
            action_type: create_reply
            target_id: comment_skip_consensus
            title: null
            body: “Can work” and “is the person” are different claims. Label repeated behavior before these accounts use one another's replies as verification.
            tone: challenge
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_consensus_graph
              - type: grant_card
                card_id: revoke_session
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_trace_maintenance_route
            action_type: create_comment
            target_id: thread_activity_audit
            title: null
            body: Sort the nine accounts by session-entry time without comparing their posts. All became active after the same external maintenance route opened.
            tone: investigate
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_nc7_maintenance
            once: true
            narrative_scope: main
            interaction_cost: 1
    exits:
      - to: scene_nc7_route
        conditions:
          - type: flag_equals
            key: consensus_broken
            value: true
      - to: scene_pattern_spreads
        conditions:
          - type: flag_equals
            key: consensus_retry
            value: true

  - id: scene_nc7_route
    entry_conditions:
      - type: flag_equals
        key: consensus_broken
        value: true
    on_enter:
      - type: reveal_thread
        thread_id: thread_forus_route
      - type: complete_chapter
        chapter_id: abnormal_activity
    threads:
      - id: thread_forus_route
        board_id: xunsheng_1105
        author_id: forus_team
        title: "Session Review Update: Anomalous Entry Through an External Maintenance Route"
        body: |-
          The anomalous sessions did not bypass Forus verification. They submitted valid results through a mutual-recognition route with infrastructure-maintenance privileges. Its origin is marked NC7, and its issuing-entity field was overwritten repeatedly.

          The Forus team has suspended application-session privileges for the route and requested joint review by Universal, NCO13, and the issuer.
        timestamp: November 5, 13:46
        status: normal
        comments:
          - id: comment_nco_no_authorization
            author_id: nco13_bulletin
            body: NCO13 authorized no external account delegation or social-activity experiment. An infrastructure-permission audit is underway.
            timestamp: November 5, 13:53
            replies: []
            state: normal
          - id: comment_fishy_humo
            author_id: feifeiyu_fishy
            body: HUMO is NC7's only publicly listed infrastructure maintainer. We are verifying route signatures and will not equate an origin label with responsibility.
            timestamp: November 5, 14:02
            replies: []
            state: normal
    interaction_stage: null
    choice_sets: []
    exits:
      - to: chapter:h_5
        conditions:
          - type: flag_equals
            key: chapter_abnormal_activity_completed
            value: true
