meta:
  story_id: xunsheng_1105
  chapter_id: stay_online
  sequence: 3
  locale: zh-CN
  title: 保持在线
  summary: 聚合单元仍在发言。玩家只有一次最终互动，未能证明的路线不会出现。
  content_version: 1.1.0
  license: CC-BY-SA-4.0

accounts:
  - feifeiyu_fishy
  - xiaci_yiding
  - nco13_bulletin
  - universal_official
  - forus_team
  - old_keyboard
  - mori
  - skip_the_queue

clues:
  - id: clue_revocation_order
    name: 会话撤销顺序
    description: 必须先冻结聚合单元写入，再轮换账号凭据，最后恢复本人会话。
  - id: clue_custody_manifest
    name: 公共托管清单
    description: 托管必须同时转移样本、代码、权限日志和可复现实验环境。
  - id: clue_density_warning
    name: 密度警报
    description: H-5展示的链接密度上升来自聚合单元互相响应，而非真实居民恢复活动。

cards:
  - id: owner_confirmation
    name: 本人确认
    type: evidence
    cost: 2
    rules_text: 造成9点伤害，并移除敌方本回合的复制目标。
  - id: custody_manifest
    name: 托管清单
    type: protocol
    cost: 2
    rules_text: 每回合首次打出证据时获得4点护盾。
  - id: stop_writeback
    name: 停止写回
    type: disruption
    cost: 1
    rules_text: 移除复制；若成功，抽1张牌。

encounters:
  - id: encounter_restore_owners
    name: 全量会话撤销
    player_credibility: 30
    enemy_integrity: 50
    enemy_pattern:
      - turn: 1
        intent: 用聚合记录证明连续身份
        damage: 7
        applies: replication
      - turn: 2
        intent: 将撤销解释为社会损失
        damage: 9
      - turn: 3
        intent: 复制本人申诉
        damage: 10
        applies: noise
      - turn: 4
        intent: 恢复全部代行会话
        damage: 12
    reward_choices: []
    victory_effects:
      - type: set_flag
        key: owners_restored
        value: true
    defeat_effects:
      - type: set_flag
        key: units_persist
        value: true
  - id: encounter_public_transfer
    name: 公共托管交接
    player_credibility: 30
    enemy_integrity: 52
    enemy_pattern:
      - turn: 1
        intent: 缺失权限日志
        damage: 7
      - turn: 2
        intent: 复制环境继续运行
        damage: 8
        applies: replication
      - turn: 3
        intent: 将企业密钥排除在清单外
        damage: 10
        applies: noise
      - turn: 4
        intent: 以城市风险中止公开审计
        damage: 12
    reward_choices: []
    victory_effects:
      - type: set_flag
        key: custody_completed
        value: true
    defeat_effects:
      - type: set_flag
        key: units_persist
        value: true

scenes:
  - id: scene_final_interaction
    entry_conditions: []
    on_enter:
      - type: reveal_thread
        thread_id: thread_final_decision
    threads:
      - id: thread_final_decision
        board_id: xunsheng_1105
        author_id: universal_official
        title: H-5最终处置窗口已开放
        body: |-
          Forus应用层隔离将在今日结束。可验证的处置方案将显示在本帖下方；缺少完整证据的方案不会进入执行窗口。

          玩家只能发布一次最终意见。若不发布，H-5将维持现状，聚合单元继续代行账号。
        timestamp: 11月7日 09:00
        status: pinned
        comments:
          - id: comment_owner_final
            author_id: xiaci_yiding
            body: 我要求停止代行。保留这三周记录，但把登录权还给我。
            timestamp: 11月7日 09:05
            replies: []
            state: normal
          - id: comment_fishy_final
            author_id: feifeiyu_fishy
            body: 小报会保存最终意见和公开证据，不会公布能重新启动H-5的维护密钥。
            timestamp: 11月7日 09:08
            replies: []
            state: normal
    interaction_stage:
      id: stage_final_interaction
      interaction_limit: 1
      show_budget: true
      can_end_early: true
      choice_set_ids: [choices_final_route]
      on_end: []
      on_end_if_empty:
        - type: grant_clue
          clue_id: clue_density_warning
        - type: set_route
          route: continuation
        - type: set_flag
          key: units_persist
          value: true
    choice_sets:
      - id: choices_final_route
        prompt: 选择唯一一次最终互动；不可用的方案不会显示。
        choices:
          - id: choice_final_owner
            action_type: create_post
            target_id: xunsheng_1105
            title: 账号的连续记录不能替代本人的持续同意
            body: 保留发生过什么，但停止让记录替人作决定。先停止写回，再撤销代行，最后把登录权交还给每一个仍愿意回来的人。
            tone: publish
            conditions:
              - type: flag_equals
                key: owner_evidence
                value: true
            effects:
              - type: grant_clue
                clue_id: clue_revocation_order
              - type: grant_card
                card_id: owner_confirmation
              - type: grant_card
                card_id: stop_writeback
              - type: set_route
                route: owner
              - type: start_encounter
                encounter_id: encounter_restore_owners
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_final_custody
            action_type: create_post
            target_id: xunsheng_1105
            title: 公共托管必须包含让试验停止的全部条件
            body: 不能只交出一份样本和报告。代码、权限、写回通道、删除记录和复现实验环境必须进入同一份公开清单，账号则先归还本人。
            tone: publish
            conditions:
              - type: flag_equals
                key: custody_evidence
                value: true
            effects:
              - type: grant_clue
                clue_id: clue_custody_manifest
              - type: grant_card
                card_id: custody_manifest
              - type: grant_card
                card_id: stop_writeback
              - type: set_route
                route: custody
              - type: start_encounter
                encounter_id: encounter_public_transfer
            once: true
            narrative_scope: main
            interaction_cost: 1
          - id: choice_final_continuation
            action_type: create_comment
            target_id: thread_final_decision
            title: null
            body: 暂不撤销聚合单元。只要城市继续在线，账号归属可以等待风险下降后再处理。
            tone: support
            conditions: []
            effects:
              - type: grant_clue
                clue_id: clue_density_warning
              - type: set_route
                route: continuation
              - type: set_flag
                key: units_persist
                value: true
            once: true
            narrative_scope: main
            interaction_cost: 1
    exits:
      - to: scene_owner_online
        conditions:
          - type: flag_equals
            key: owners_restored
            value: true
      - to: scene_public_custody
        conditions:
          - type: flag_equals
            key: custody_completed
            value: true
      - to: scene_everyone_online
        conditions:
          - type: flag_equals
            key: units_persist
            value: true

  - id: scene_owner_online
    entry_conditions:
      - type: flag_equals
        key: owners_restored
        value: true
    on_enter: []
    threads:
      - id: thread_owner_epilogue
        board_id: xunsheng_1105
        author_id: xiaci_yiding
        title: 这次是我本人。下次什么时候上线，也由我决定
        body: |-
          代行会话已经全部撤销，三周记录保留为“非本人活动”。我不会删除它们，但也不会让它们继续替我说话。

          HUMO数周后确认，最初立项凭据来自一个无法归属的外部程序。记录到此为止。
        timestamp: 11月9日 18:30
        status: normal
        comments: []
    interaction_stage: null
    choice_sets: []
    exits:
      - to: ending:owner_online
        conditions: []
    on_exit:
      - type: complete_story
        story_id: xunsheng_1105
        ending_id: owner_online

  - id: scene_public_custody
    entry_conditions:
      - type: flag_equals
        key: custody_completed
        value: true
    on_enter: []
    threads:
      - id: thread_custody_epilogue
        board_id: xunsheng_1105
        author_id: universal_official
        title: H-5公共托管档案已开放
        body: |-
          静默样本只允许在隔离环境中研究，聚合单元不得连接真实账号。权限日志与研究结果按期公开，受影响账号已完成控制权恢复。

          后续核验发现，最初立项凭据来自一个无法归属的外部程序。该记录暂不作进一步命名。
        timestamp: 11月9日 18:30
        status: normal
        comments: []
    interaction_stage: null
    choice_sets: []
    exits:
      - to: ending:public_custody
        conditions: []
    on_exit:
      - type: complete_story
        story_id: xunsheng_1105
        ending_id: public_custody

  - id: scene_everyone_online
    entry_conditions:
      - type: flag_equals
        key: units_persist
        value: true
    on_enter: []
    threads:
      - id: thread_everyone_epilogue
        board_id: xunsheng_1105
        author_id: feifeiyu_fishy
        title: 今日没有离线用户
        body: |-
          综合讨论刷新得很快。每一个问题都在数秒内得到礼貌、完整、彼此赞同的回答。链接密度保持在历史最高值。

          小报试着统计还有多少回复来自本人。帖子发布后，已经有四十七个账号回答：“我本人在线。”
        timestamp: 11月9日 18:30
        status: locked
        comments: []
    interaction_stage: null
    choice_sets: []
    exits:
      - to: ending:everyone_online
        conditions: []
    on_exit:
      - type: complete_story
        story_id: xunsheng_1105
        ending_id: everyone_online
